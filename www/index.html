<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>GaragePro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* ===== Tokens (v0.6) — estilo × modo × cor de destaque. O JS define --pri/--pri-tx e os data-attributes ===== */
:root{
 --pri:#3b82f6;--pri-tx:#fff;
 --ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--vio:#a78bfa;--info:#60a5fa;
 --bg:#0b0d10;--sheet:#13161b;--card:#15181d;--card2:#1c2026;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
 --tx:#eceef2;--tx2:#c4c9d1;--mut:#8b929d;--faint:#5d646f;--ph1:#1d222a;--ph2:#2b323d;
 --r:14px;--rs:10px;--rb:12px;--sh:0 1px 2px rgba(0,0,0,.35);--sh2:0 10px 30px rgba(0,0,0,.35);
 --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--fh:var(--font);--hw:700;--htt:none;--hls:-.2px;--hst:normal;
 --soft:color-mix(in srgb,var(--pri) 14%,transparent);--pline:color-mix(in srgb,var(--pri) 45%,transparent);
 color-scheme:dark;
}
[data-mode=light]{--ok:#15803d;--warn:#b45309;--bad:#dc2626;--vio:#7c3aed;--info:#2563eb;
 --bg:#f3f4f6;--sheet:#fff;--card:#fff;--card2:#f3f4f6;--line:rgba(15,23,42,.08);--line2:rgba(15,23,42,.15);
 --tx:#111418;--tx2:#3b424c;--mut:#6b7280;--faint:#9ca3af;--ph1:#e5e7eb;--ph2:#cbd0d8;--sh:0 1px 2px rgba(15,23,42,.06);--sh2:0 10px 30px rgba(15,23,42,.12);color-scheme:light}
/* Oficina: grafite quente, cantos vivos, títulos condensados em maiúsculas */
[data-style=oficina]{--bg:#121212;--sheet:#1a1a1a;--card:#1b1b1b;--card2:#242424;--tx:#efefef;--tx2:#cfcfcf;--mut:#9b9b9b;--ph1:#232323;--ph2:#333;
 --r:6px;--rs:4px;--rb:6px;--fh:"Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;--hw:700;--htt:uppercase;--hls:.04em}
[data-style=oficina][data-mode=light]{--bg:#ebe9e4;--sheet:#fbfaf7;--card:#fbfaf7;--card2:#f0eee9;--tx:#16150f;--tx2:#3d3a33;--mut:#706b60;--ph1:#dedbd3;--ph2:#c7c2b6;--line:rgba(30,25,15,.1);--line2:rgba(30,25,15,.18)}
/* Desportivo: preto azulado, cantos médios, títulos em itálico pesado */
[data-style=desportivo]{--bg:#07080b;--sheet:#101218;--card:#101218;--card2:#171a22;--tx:#f2f3f5;--tx2:#c9ccd3;--mut:#8a8f9a;--ph1:#151821;--ph2:#252a36;
 --r:10px;--rs:8px;--rb:8px;--hw:800;--hst:italic;--hls:-.3px}
[data-style=desportivo][data-mode=light]{--bg:#f2f3f5;--sheet:#fff;--card:#fff;--card2:#eef0f3;--tx:#0d0f13;--tx2:#353a44;--mut:#6b7079;--ph1:#e3e5ea;--ph2:#c9cdd5}
html,body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px}
body{min-height:100dvh;transition:background .25s}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100dvh;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
input,select,textarea{font:inherit;color:var(--tx)}
select option,select optgroup{background:var(--sheet);color:var(--tx)}
.i{width:22px;height:22px;flex:none}
.i.s{width:16px;height:16px}
.mt{margin-top:12px}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
/* header */
.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid transparent}
.hdr h1{flex:1;text-align:center;font-size:17px;font-weight:var(--hw);font-family:var(--fh);text-transform:var(--htt);letter-spacing:var(--hls);font-style:var(--hst);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .hl,.hdr .hr{display:flex;gap:6px;min-width:44px}
.hdr .hr{justify-content:flex-end}
.hdr.root h1{text-align:left;font-size:24px;padding-left:4px}
.hdr.root .hl{display:none}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:var(--rb);color:var(--tx);position:relative;flex:none;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.ib .i{width:20px;height:20px}
.ib.pri{background:var(--pri);border-color:transparent;color:var(--pri-tx)}
.ib.plain{background:none;border:0;box-shadow:none}
.logo{flex:1;display:flex;align-items:center;gap:10px;font-size:20px;font-weight:var(--hw);font-family:var(--fh);text-transform:var(--htt);letter-spacing:var(--hls);font-style:var(--hst)}
.logo .lt span{color:var(--pri)}
.badge{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:10px;font-style:normal;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;font-weight:700;border:2px solid var(--bg)}
.badge.dotb{min-width:10px;height:10px;padding:0;top:-3px;right:-3px}
.hello{padding:6px 18px 2px}
.hello h2{font-size:24px;font-weight:var(--hw);font-family:var(--fh);text-transform:var(--htt);letter-spacing:var(--hls);font-style:var(--hst)}
.hello p{color:var(--mut);font-size:14px;margin-top:2px}
.hello p::first-letter{text-transform:uppercase}
.wrap{padding:0 16px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:22px 16px 10px}
.sec h2{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
[data-style=oficina] .sec h2::before{content:"";width:10px;height:10px;background:var(--pri)}
[data-style=desportivo] .sec h2{font-style:italic}
[data-style=desportivo] .sec h2::before{content:"";width:14px;height:4px;background:var(--pri);transform:skewX(-25deg)}
.sec a{color:var(--pri);font-size:14px;display:flex;align-items:center;gap:3px;cursor:pointer;white-space:nowrap;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
/* cores semânticas — tons suaves a partir do token */
.bub{width:40px;height:40px;border-radius:var(--rs);display:grid;place-items:center;flex:none}
.bub .i{width:20px;height:20px}
.b-ok{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.b-warn{background:color-mix(in srgb,var(--warn) 13%,transparent);color:var(--warn)}
.b-bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.b-pri{background:var(--soft);color:var(--pri)}
.b-vio{background:color-mix(in srgb,var(--vio) 13%,transparent);color:var(--vio)}
.b-mut{background:color-mix(in srgb,var(--mut) 13%,transparent);color:var(--mut)}
.b-info{background:color-mix(in srgb,var(--info) 13%,transparent);color:var(--info)}.c-info{color:var(--info)}.t-info{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}.fincard.st-info{color:var(--info)}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}.c-pri{color:var(--pri)}.c-vio{color:var(--vio)}.c-mut{color:var(--mut)}
/* números do topo */
.mstrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:14px 16px 0}
.ms{padding:12px;cursor:pointer;position:relative;overflow:hidden}
.ms .bub{width:30px;height:30px}
.ms .bub .i{width:16px;height:16px}
.ms b{display:block;font-size:16px;font-weight:750;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx);font-variant-numeric:tabular-nums}
.ms small{display:block;color:var(--mut);font-size:12px;margin-top:1px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:0 16px}
.grid2.np{padding:0}
.tile{display:flex;align-items:center;gap:12px;padding:14px 12px;min-width:0}
.tile>div{min-width:0}
.tile b{display:block;font-size:16px;font-weight:700;line-height:1.2;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.tile small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
/* cartão do veículo */
.vcard{margin:0 16px 14px;overflow:hidden;cursor:pointer}
.photo{position:relative;height:176px;background:var(--ph1);overflow:hidden}
.photo img,.photo .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.72));pointer-events:none}
.hero{height:220px}
.vinfo{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:flex-end;gap:10px;padding:12px 14px;color:#fff}
.vinfo .nm{min-width:0}
.vinfo b{display:block;font-size:20px;font-weight:var(--hw);font-family:var(--fh);text-transform:var(--htt);letter-spacing:var(--hls);font-style:var(--hst);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vinfo small{color:rgba(255,255,255,.78);font-size:13px}
.mono{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;background:rgba(0,0,0,.35)}
.vkm{margin-left:auto;font-weight:700;font-size:13.5px;white-space:nowrap;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);padding:5px 10px;border-radius:var(--rs);font-variant-numeric:tabular-nums}
.edit{margin-left:auto;background:var(--pri);color:var(--pri-tx);border-radius:var(--rs);padding:8px 16px;font-size:14px;font-weight:650}
.plate{display:inline-flex;align-items:stretch;height:26px;border-radius:5px;background:linear-gradient(180deg,#fff,#e6ebf2);border:1.5px solid #151515;box-shadow:0 2px 8px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.9);overflow:hidden;color:#111;font-family:"DIN Alternate","DIN Condensed","Arial Narrow","Roboto Condensed",Arial,sans-serif;font-weight:800;flex:none;vertical-align:middle}
.plate .eu{width:15px;background:linear-gradient(180deg,#0a3fb0,#002a86);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 0 2px;font-size:8.5px;line-height:1;font-family:Arial,sans-serif}
.plate .eu svg{width:10px;height:10px}
.plate .n{display:flex;align-items:center;padding:0 7px 0 6px;font-size:14.5px;letter-spacing:1px;white-space:nowrap}
.plate b{font-size:inherit!important;font-weight:800!important;color:inherit;display:block}
.plate .yr{width:14px;background:linear-gradient(180deg,#ffd733,#f0b800);border-left:1px solid rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:9.5px;line-height:1;font-family:"Arial Narrow","Roboto Condensed",Arial,sans-serif;color:#111;letter-spacing:-.2px;font-variant-numeric:tabular-nums}
.plate.abs{position:absolute;top:12px;left:12px;z-index:3}
.plate.sm{height:22px;border-width:1px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.plate.sm .eu{width:10px;font-size:7.5px;padding:0;justify-content:center}.plate.sm .eu svg{display:none}
.plate.sm .n{font-size:10.5px;padding:0 5px 0 4px;letter-spacing:.6px}
.plate.sm .yr{width:12px;font-size:8.5px;gap:0;letter-spacing:-.3px}
.pl-row{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}
.own{position:absolute;top:12px;right:12px;z-index:3;font-size:12px;font-weight:600;padding:4px 10px;border-radius:var(--rs);background:rgba(0,0,0,.5);color:#fff;border:1px solid rgba(255,255,255,.18)}
.chips{display:flex;gap:8px;padding:10px}
.chip{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:10px 10px 12px;border-radius:var(--rs);position:relative;overflow:hidden;border:1px solid var(--line);background:var(--card2)}
.chip .ci{flex:none;display:grid}
.chip small{display:block;font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{display:block;font-size:12.5px;font-weight:650;white-space:nowrap}
.chip>div{min-width:0}
.chip .pb{position:absolute;left:10px;right:10px;bottom:5px;height:3px;border-radius:2px;background:var(--line2);overflow:hidden}
.chip .pb i{display:block;height:100%}
.chip.none{color:var(--mut);font-size:13px}
.s-ok .ci,.s-ok b{color:var(--ok)}.s-ok .pb i{background:var(--ok)}
.s-warn{border-color:color-mix(in srgb,var(--warn) 40%,transparent)}.s-warn .ci,.s-warn b{color:var(--warn)}.s-warn .pb i{background:var(--warn)}
.s-bad{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 7%,var(--card2))}.s-bad .ci,.s-bad b{color:var(--bad)}.s-bad .pb i{background:var(--bad)}
.chip-go{width:34px;flex:none;border-radius:var(--rs);background:var(--card2);display:grid;place-items:center;border:1px solid var(--line);color:var(--mut)}
.add-veh{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 16px;width:calc(100% - 32px);height:54px;border:1.5px dashed var(--line2);border-radius:var(--r);color:var(--tx2);font-size:15px;font-weight:600}
.add-veh .i{color:var(--pri)}
/* separadores, filtros, segmentos */
.tabs{display:flex;gap:6px;padding:12px 16px 4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar,.fchips::-webkit-scrollbar{display:none}
.tabs button{padding:9px 14px;border-radius:var(--rs);font-size:14px;color:var(--tx2);white-space:nowrap;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:6px}
.tabs button .i{width:16px;height:16px}
.tabs.eq button{flex:1;flex-direction:column;gap:4px;padding:8px 2px;font-size:12px;min-width:0}
.tabs.eq button .i{width:19px;height:19px}
.tabs .on{background:var(--pri);border-color:transparent;color:var(--pri-tx)}
.fchips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none}
.fchips button{padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);white-space:nowrap;font-size:13.5px;color:var(--tx2)}
[data-style=oficina] .fchips button{border-radius:var(--rs)}
.fchips .on{background:var(--soft);border-color:var(--pline);color:var(--pri);font-weight:600}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:var(--rb);padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:calc(var(--rb) - 3px);font-size:14px;color:var(--tx2);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button .i{width:17px;height:17px}
.seg .on{background:var(--card);color:var(--tx);font-weight:650;box-shadow:0 1px 3px rgba(0,0,0,.18);border:1px solid var(--line2)}
.seg .on.bad{background:var(--bad);color:#fff;border-color:transparent}
.seg .on.t-ok{background:var(--ok);color:#fff;border-color:transparent}.seg .on.t-warn{background:var(--warn);color:#fff;border-color:transparent}.seg .on.t-vio{background:var(--vio);color:#fff;border-color:transparent}
/* linhas */
.list{padding:0 16px}
.row{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.row .mid{flex:1;min-width:0}
.row b{font-weight:650;font-size:15px}
.row small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.row .rt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.row .rt span{font-size:13.5px;font-weight:650;white-space:nowrap}
.row>.i{color:var(--faint)}
.amt{text-align:right;flex:none}
.amt b{display:block;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.amt small{display:block;color:var(--mut);font-size:12px;margin-top:3px}
.ico{--c:var(--mut);width:42px;height:42px;border-radius:var(--rs);display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
[data-mode=light] .ico{background:color-mix(in srgb,var(--c) 12%,transparent);color:color-mix(in srgb,var(--c) 80%,#000)}
.ico .i{width:21px;height:21px}
.ico.lg{width:48px;height:48px}.ico.lg .i{width:24px;height:24px}
.ico.sm{width:34px;height:34px}.ico.sm .i{width:18px;height:18px}
.pbar{height:4px;border-radius:2px;background:var(--line2);margin-top:9px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:2px}
.thumb{width:78px;height:56px;border-radius:var(--rs);overflow:hidden;position:relative;flex:none;background:var(--ph1)}
.thumb img,.thumb .ph{width:100%;height:100%;object-fit:cover;display:block}
.av{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:750;color:var(--pri);flex:none;font-size:16px}
.av.lg{width:56px;height:56px;font-size:21px}
.tag{display:inline-block;font-size:11.5px;font-weight:650;padding:3px 8px;border-radius:6px;white-space:nowrap}
.t-bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.t-warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.t-ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.t-pri{background:var(--soft);color:var(--pri)}
.t-mut{background:color-mix(in srgb,var(--mut) 13%,transparent);color:var(--mut)}
.mhead{padding:16px 20px 8px;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:650}
/* linha temporal */
.tl{position:relative;padding:0 16px 0 34px}
.tl::before{content:"";position:absolute;left:20px;top:8px;bottom:8px;width:2px;background:var(--line2)}
.tli{position:relative;display:flex;gap:12px;padding:12px;margin-bottom:10px;cursor:pointer}
.tli .dot{position:absolute;left:-18px;top:24px;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 3px var(--bg)}
.tli .mid{flex:1;min-width:0}
.tli .r1{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.tli .km1{color:var(--tx2);font-weight:650}
.tli .t{font-weight:650;margin:4px 0 3px;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tli .s{font-size:12.5px;color:var(--mut)}
/* finanças */
.fincard{margin:12px 16px 0;padding:4px 16px 6px;position:relative;overflow:hidden;border-top:3px solid currentColor}
.fincard.st-warn{color:var(--warn)}.fincard.st-pri{color:var(--pri)}.fincard.st-ok{color:var(--ok)}.fincard.st-mut{color:var(--line2)}
.fin-big{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line)}
.fin-big small{display:block;color:var(--mut);font-size:13px}
.fin-big b{display:block;font-size:28px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.fincard.st-mut .fin-big b{color:var(--tx)}
.fincard .kv{color:var(--tx)}
.acts{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:var(--r);font-size:13px;font-weight:650;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh);color:var(--tx)}
.act .i{width:22px;height:22px}
.a-ok .i{color:var(--ok)}.a-warn .i{color:var(--warn)}.a-vio .i{color:var(--vio)}
/* formulários */
.fl{display:block;font-size:13px;color:var(--tx2);margin:16px 0 7px;font-weight:600}
.in{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line2);border-radius:var(--rb);padding:0 12px;height:48px;position:relative}
.in>.i{color:var(--mut);width:19px;height:19px}

.dt .r{text-align:right}.dt .num{font-variant-numeric:tabular-nums;white-space:nowrap}.dt .mut,.mut{color:var(--mut)}
.dt .lnk.sm{display:inline-flex}
.dveh{display:flex;align-items:center;gap:12px;min-width:0}
.dveh .mid{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.dveh .mid b{max-width:240px}
.dth{width:56px;height:38px;border-radius:8px;overflow:hidden;flex:none;background:var(--ph1)}
.dth img,.dth svg{width:100%;height:100%;object-fit:cover;display:block}
.addtile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:200px;border:1.5px dashed var(--line2);border-radius:var(--r);color:var(--tx2);font-weight:600;font-size:14.5px;transition:border-color .15s,color .15s}
.addtile .i{width:28px;height:28px;color:var(--pri)}.addtile:hover{border-color:var(--pri);color:var(--tx)}
.dveh2{display:grid;grid-template-columns:380px minmax(0,1fr);gap:22px;margin-top:18px;align-items:start}
@media (max-width:1280px){.dveh2{grid-template-columns:320px minmax(0,1fr)}}
.dvl .vfc{margin:0}
.dact{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.dorg{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-bottom:20px}
.dorg .orcard{margin:0}
.dvr>.dpanel{margin-top:8px}
.nfoot{display:none}
[data-layout=desktop] .nfoot{display:flex;flex-direction:column;gap:3px;margin-top:auto;padding:14px 14px 2px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut)}
[data-layout=desktop] .dt .av{width:34px;height:34px;font-size:13px;flex:none}
[data-layout=desktop] .nfoot span:first-child{font-weight:650;color:var(--tx2)}
html.pc[data-layout=desktop] .nbrand{display:none}
html.pc[data-layout=desktop] .nav{padding-top:14px}
html[data-layout=desktop]::-webkit-scrollbar,[data-layout=desktop] ::-webkit-scrollbar{width:12px;height:12px}
html[data-layout=desktop]::-webkit-scrollbar-track,[data-layout=desktop] ::-webkit-scrollbar-track{background:transparent}
html[data-layout=desktop]::-webkit-scrollbar-thumb,[data-layout=desktop] ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:12px;border:3px solid transparent;background-clip:padding-box}
html[data-layout=desktop]::-webkit-scrollbar-thumb:hover,[data-layout=desktop] ::-webkit-scrollbar-thumb:hover{background-color:var(--mut)}
[data-layout=desktop] .list{grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}

/* pré-visualização dos layouts no seletor */
.lygrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ly{border:2px solid var(--line);border-radius:var(--rs);padding:8px 4px 7px;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600}
.ly.on{border-color:var(--pri);color:var(--pri)}
.ly .i{width:24px;height:24px}
.steps{margin:12px 0 0 20px;color:var(--tx2);font-size:14px;line-height:1.7}
.xgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:8px 16px 0}
.xbtn{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px;text-align:left;min-height:150px}
.xbtn>b{font-size:18px;font-weight:var(--hw);font-family:var(--fh);text-transform:var(--htt);letter-spacing:var(--hls);font-style:var(--hst)}
.xbtn small{color:var(--mut);font-size:12.5px;line-height:1.4}.xbtn small b{color:var(--tx);font-weight:600}
.xbtn .bub{width:44px;height:44px}.xbtn .bub .i{width:22px;height:22px}
#dropov{position:fixed;inset:0;z-index:90;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(6px);display:grid;place-items:center;pointer-events:none}
#dropov>div{border:2px dashed var(--pri);border-radius:var(--r);padding:40px 56px;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--pri)}
#dropov .i{width:40px;height:40px}#dropov b{font-size:18px;color:var(--tx)}#dropov small{color:var(--mut)}
@keyframes su{from{transform:translateY(40px);opacity:.4}}
@keyframes fd{from{opacity:0}}
</style>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const arr=a=>Array.isArray(a)?a:[];
const grp=s=>s.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const fmtN=n=>n==null||isNaN(n)?'':(n<0?'-':'')+grp(String(Math.round(Math.abs(n))));
const fmtE=n=>{n=+n||0;const f=Math.abs(n).toFixed(2).split('.');return (n<-0.004?'-':'')+grp(f[0])+','+f[1]+' €'};
const fmtQ=n=>{n=+n||0;if(Number.isInteger(n))return grp(String(n));return n.toFixed(3).replace(/0+$/,'').replace('.',',')};
const decIn=n=>n?String(+n).replace('.',','):'';
const pInt=s=>{const d=String(s??'').replace(/\D/g,'');return d?parseInt(d,10):null};
const pDec=s=>{s=String(s??'').replace(/[\s€]/g,'');if(!s)return null;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');const n=parseFloat(s);return isNaN(n)?null:n};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayISO=()=>iso(new Date());

const fmtD=s=>{if(!s)return'';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`};

const addM=(d,m)=>{const x=new Date(d);x.setMonth(x.getMonth()+m);return x};

const fmtDur=d=>{d=Math.max(0,Math.round(d));if(d<60)return d+(d===1?' dia':' dias');const m=Math.round(d/30.44);if(m<24)return m+' meses';const y=Math.floor(m/12),r=m%12;return y+' anos'+(r?' e '+r+(r===1?' mês':' meses'):'')};

let S={vehicles:[],records:[],clients:[],moves:[],tasks:[],intervals:{},prefs:{bg:'tema',bgInt:'media'},ver:3};
let UI={tkF:'porfazer',cur:null,vtab:'resumo',tlType:'all',tlVeh:'all',ftab:'cli',fType:'all'};
let F=null,VF=null,MV=null,DBOK=true;
const DB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('garagepro',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
 get(k){return new Promise((res,rej)=>{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
 set(k,v){return new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
};
// Converte dados de versões anteriores (dinheiro dentro das reparações) para o formato atual (Finanças separadas)
function normalize(o){return sanitize(migrate(o))}
function migrate(o){
 o=o&&typeof o==='object'?o:{};
 const s={vehicles:arr(o.vehicles),records:arr(o.records).filter(r=>r.kind!=='despesa'),clients:arr(o.clients),moves:arr(o.moves),tasks:arr(o.tasks),intervals:o.intervals||{},prefs:{bg:'tema',bgInt:'media',...(o.prefs||{})},ver:o.ver||1};
 s.vehicles.forEach(v=>{if(v.owner===undefined)v.owner=''});
 if(s.ver>=3)return s;
 const keep=[];
 s.records.forEach(r=>{
  const pecas=arr(r.pecas);
  const pt=pecas.reduce((a,p)=>a+(+p.preco||0),0);
  const mao=+r.mao||0;
  const outros=r.v2?(+r.outros||0):Math.max(0,(+r.custo||0)-pt-mao);
  const base={vid:r.vid||'',cid:r.vid?'':(r.cid||'')};
  const t=recTitle(r);
  if(pt>0)s.moves.push({id:uid(),tipo:'comprei',valor:pt,pago:true,data:r.data,desc:'Peças — '+t,...base});
  if(outros>0)s.moves.push({id:uid(),tipo:'comprei',valor:outros,pago:true,data:r.data,desc:'Outros custos — '+t,...base});
  if(mao>0)s.moves.push({id:uid(),tipo:'cobrar',valor:mao,data:r.data,desc:'Mão de obra — '+t,...base});
  arr(r.adiant).forEach(a=>s.moves.push({id:uid(),tipo:'recebi',valor:+a.valor||0,data:a.data||r.data,desc:a.nota||'Adiantamento',...base}));
  if(r.pendente||(!r.km&&!pecas.length&&r.tipo==='outro'))return; // era só um adiantamento / trabalho ainda não feito
  keep.push({id:r.id,vid:r.vid||'',kind:r.kind==='peca'?'peca':'manutencao',tipo:r.tipo,titulo:r.titulo||'',motivo:r.motivo||'preventiva',data:r.data,km:r.km||null,pecas:pecas.map(p=>({key:p.key||'',nome:p.nome,qtd:+p.qtd||1,un:p.un||'un'})),notas:r.notas||''});
 });
 s.records=keep;s.ver=3;
 return s;
}
function save(){
 if(DBOK){DB.set('state',S).catch(()=>toast('Erro ao guardar os dados!'));}
 else{try{localStorage.setItem('garagepro',JSON.stringify(S))}catch(e){toast('Erro ao guardar os dados!')}}
 try{syTrack()}catch(_){}
}

/* ================== FINANÇAS ================== */
const MT={
 recebi:{n:'Recebi',ic:'in',c:'ok',def:'Pagamento / adiantamento',sg:'+ ',ex:'Dinheiro que o cliente te deu — adiantamento ou pagamento.',ph:'Ex: adiantamento para peças'},
 comprei:{n:'Comprei',ic:'cart',c:'warn',def:'Compra de peças',sg:'− ',ex:'Peças ou material que compraste. Num carro de cliente, entra na conta dele.',ph:'Ex: kit embraiagem + rolamento'},
 cobrar:{n:'A cobrar',ic:'receipt',c:'vio',def:'Mão de obra',sg:'',ex:'Valor a cobrar ao cliente que não é peça (mão de obra, serviços…).',ph:'Ex: mão de obra da embraiagem'}
};
const mvCli=m=>{if(m.cid)return cli(m.cid);const v=veh(m.vid);return v?cli(v.owner):null};
function bal(ms){let comp=0,cob=0,rec=0,pp=0;ms.forEach(m=>{const x=+m.valor||0;if(m.tipo==='comprei'){comp+=x;if(!m.pago)pp+=x}else if(m.tipo==='cobrar')cob+=x;else rec+=x});return{comp,cob,rec,pp,tot:comp+cob,s:comp+cob-rec}}
const vMoves=vid=>{const v=veh(vid),o=(v&&v.owner)||'';return liveMoves(S.moves.filter(m=>m.vid===vid&&(m.cid||'')===o))};
const cMoves=cid=>liveMoves(S.moves.filter(m=>{const c=mvCli(m);return c&&c.id===cid}));
const cBal=cid=>bal(cMoves(cid));
function globalFin(){
 let rec=0,adi=0;
 S.clients.forEach(c=>{const b=cBal(c.id);if(b.s>0.004)rec+=b.s;else if(b.s<-0.004)adi-=b.s});
 const pp=liveMoves(S.moves).filter(m=>m.tipo==='comprei'&&!m.pago).reduce((a,m)=>a+(+m.valor||0),0);
 const mk=todayISO().slice(0,7);
 const rm=liveMoves(S.moves).filter(m=>m.tipo==='recebi'&&m.data.startsWith(mk)).reduce((a,m)=>a+(+m.valor||0),0);
 return{rec,adi,pp,rm};
}
function stTag(b){
 if(b.s>0.004)return `<span class="tag t-warn">Falta ${fmtE(b.s)}</span>`;
 if(b.s<-0.004)return `<span class="tag t-info">Adiantado ${fmtE(-b.s)}</span>`;
 if(b.tot||b.rec)return `<span class="tag t-ok">Pago</span>`;
 return `<span class="tag t-mut">Sem valores</span>`;
}
function finCard(b,client){
 if(!client)return `<div class="card fincard st-${b.pp?'warn':'mut'}"><div class="fin-big"><span class="bub b-warn">${I('cart')}</span><div><small>Gasto neste carro</small><b style="color:var(--tx)">${fmtE(b.comp)}</b></div></div>${b.pp?`<div class="kv"><span>Por pagar à loja</span><b class="c-bad">${fmtE(b.pp)}</b></div>`:'<div class="kv"><span>Compras</span><b>tudo pago à loja</b></div>'}</div>`;
 const s=b.s,st=s>0.004?['warn','Falta receber',fmtE(s),'alert']:s<-0.004?['info','Adiantado por gastar',fmtE(-s),'wallet']:(b.tot||b.rec)?['ok','Tudo pago','0,00 €','check']:['mut','Sem valores','0,00 €','wallet'];
 return `<div class="card fincard st-${st[0]}"><div class="fin-big"><span class="bub b-${st[0]}">${I(st[3])}</span><div><small>${st[1]}</small><b>${st[2]}</b></div></div>
  <div class="kv"><span>Peças compradas</span><b>${fmtE(b.comp)}</b></div>
  <div class="kv"><span>Mão de obra / a cobrar</span><b>${fmtE(b.cob)}</b></div>
  <div class="kv"><span>Total</span><b>${fmtE(b.tot)}</b></div>
  <div class="kv"><span>Já recebido</span><b class="c-ok">${fmtE(b.rec)}</b></div>
  ${b.pp?`<div class="kv"><span>Compras por pagar à loja</span><b class="c-bad">${fmtE(b.pp)}</b></div>`:''}</div>`;
}
const acts=(t,client)=>`<div class="acts">${client?`<button class="act a-ok" onclick="moveSheet(null,'recebi','${t}')">${I('in')}<span>Recebi</span></button>`:''}<button class="act a-warn" onclick="moveSheet(null,'comprei','${t}')">${I('cart')}<span>Comprei</span></button>${client?`<button class="act a-vio" onclick="moveSheet(null,'cobrar','${t}')">${I('receipt')}<span>A cobrar</span></button>`:''}</div>`;
function moveRow(m,showT=true){
 const t=MT[m.tipo]||MT.recebi,v=veh(m.vid),c=mvCli(m);
 const who=[v?vName(v):'',c?c.nome:(v?'':'Geral')].filter(Boolean).join(' · ');
 return `<div class="row card" onclick="moveSheet('${m.id}')"><span class="bub b-${t.c}">${I(t.ic)}</span><div class="mid"><b>${esc(m.desc||t.def)}</b><small>${fmtD(m.data)}${showT&&who?' · '+esc(who):''}</small></div><div class="amt"><b class="c-${t.c}">${t.sg}${fmtE(m.valor)}</b>${m.tipo==='comprei'&&!m.pago?'<small><span class="tag t-bad">Por pagar</span></small>':`<small>${t.n}</small>`}</div></div>`;
}
function movesByMonth(ms,showT){
 let h='',cur='';
 ms.forEach(m=>{const k=m.data.slice(0,7);if(k!==cur){cur=k;h+=`<div class="mhead">${fmtMonth(m.data)}</div>`}h+=`<div class="list">${moveRow(m,showT)}</div>`});
 return h;
}

/* ================== MANUTENÇÃO ================== */
const getInt=k=>S.intervals[k]||{km:CAT[k].km,m:CAT[k].m};
const ivText=iv=>{const a=[];if(iv.km)a.push(fmtN(iv.km)+' km');if(iv.m)a.push(iv.m+(iv.m===1?' mês':' meses'));return a.length?a.join(' ou '):'Sem intervalo'};
function replaced(r){const s=new Set(),add=k=>{if(!CAT[k])return;if(CAT[k].kit)CAT[k].kit.forEach(x=>{if(CAT[x])s.add(x)});else s.add(k)};add(r.tipo);arr(r.pecas).forEach(p=>add(p.key));return[...s]}
function vKeys(v){const s=new Set();S.records.forEach(r=>{if(r.vid===v.id&&r.km&&isDone(r))replaced(r).forEach(k=>s.add(k))});return[...s]}
function hist(vid,key){return S.records.filter(r=>r.vid===vid&&r.km&&isDone(r)&&replaced(r).includes(key)).sort((a,b)=>(b.km-a.km)||b.data.localeCompare(a.data))}
function due(v,key){
 const h=hist(v.id,key);if(!h.length)return null;
 const last=h[0],iv=getInt(key),d={v,key,last,hist:h,none:false};
 if(!iv.km&&!iv.m){d.none=true;return d}
 let rk=0,rt=0,rKm=0,rDays=0;
 if(iv.km){rKm=last.km+iv.km-v.km;rk=(v.km-last.km)/iv.km}
 if(iv.m){const a=pd(last.data),b=addM(a,iv.m),t=today0();rDays=Math.round((b-t)/864e5);rt=(t-a)/(b-a)}
 const byT=iv.m&&(!iv.km||rt>rk);
 d.ratio=Math.max(0,byT?rt:rk);
 d.st=d.ratio>=1?'bad':d.ratio>=.8?'warn':'ok';
 d.text=byT?(rDays===0?'Hoje':rDays>0?'Em '+fmtDur(rDays):'Atrasado '+fmtDur(-rDays)):(rKm>=0?`Em ${fmtN(rKm)} km`:`Atrasado ${fmtN(-rKm)} km`);
 return d;
}

 const q=fold(PP.q).trim(),all=q.split(/\s+/).filter(Boolean),ws=all.filter(w=>!POS_W[w]),pw=all.filter(w=>POS_W[w]);
 PP.pos={};pw.forEach(w=>{const [k,v]=POS_W[w];PP.pos[k==='x'?'eixo':'lado']=v});
 const score=k=>{const c=CAT[k],n=fold(c.n),a=fold(c.a||''),ex=fold(c.kit?kitList(k):''),g=fold(c.g);
  const ok=w=>n.includes(w)||a.includes(w)||ex.includes(w)||g.includes(w);if(!ws.length||!ws.every(ok))return null;
  let sc=0;ws.forEach(w=>{sc+=n.startsWith(w)?0:n.includes(w)?1:a.includes(w)?2:ex.includes(w)?3:6});
  pw.forEach(w=>{if(n.includes(w))sc-=1});if(c.kit)sc+=.5;return sc};
 const match=k=>score(k)!==null;
 const gs=$('#pp-g');if(gs)gs.innerHTML=q?'':['',...GROUPS].map(g=>`<button class="${PP.g===g?'on':''}" onclick="PP.g='${g}';ppList()">${g||'Todas'}</button>`).join('');

// Os valores de uma reparação são movimentos normais ligados por m.rid (e m.lk: p0..p49 peça, pg peças sem detalhe, mo mão de obra, rc pagamento).
const jobMoves=rid=>S.moves.filter(m=>m.rid===rid);
function loadJobMoney(r){
 const ms=jobMoves(r.id),g=lk=>ms.find(m=>m.lk===lk);
 F.pecas.forEach((p,i)=>{const m=g('p'+i);p.preco=m?decIn(m.valor):'';p.pago=m?m.pago!==false:true});
 const pg=g('pg'),mo=g('mo'),rc=g('rc');
 F.pg=pg?decIn(pg.valor):'';F.pgPago=pg?pg.pago!==false:true;F.mo=mo?decIn(mo.valor):'';F.rc=rc?decIn(rc.valor):'';F.rcFp=rc&&rc.fp||'num';
}
function syncJobMoves(r){
 const v=veh(r.vid),own=(v&&v.owner)||'',byLk={};
 jobMoves(r.id).forEach(m=>{if(m.lk)byLk[m.lk]=m});
 S.moves=S.moves.filter(m=>!(m.rid===r.id&&m.lk));
 S.moves.forEach(m=>{if(m.rid===r.id&&m.vid!==r.vid){m.vid=r.vid;m.cid=own}});
 const title=recTitle(r);
 const add=(lk,tipo,val,desc,pago,fp)=>{const x=pDec(val);if(!(x>0))return;const o=byLk[lk];
  const m={id:o?o.id:uid(),tipo,valor:Math.round(x*100)/100,data:r.data,desc:String(desc).slice(0,120),vid:r.vid,cid:own,rid:r.id,lk};
  if(tipo==='comprei')m.pago=pago!==false;if(tipo==='recebi')m.fp=fp||'num';S.moves.push(m)};
 F.pecas.forEach((p,i)=>add('p'+i,'comprei',p.preco,p.nome,p.pago));
 if(!F.pecas.length)add('pg','comprei',F.pg,'Peças — '+title,F.pgPago);
 if(own){add('mo','cobrar',F.mo,'Mão de obra — '+title);add('rc','recebi',F.rc,'Pagamento — '+title,null,F.rcFp)}
}
const jobCharge=(rid,ms)=>(ms||jobMoves(rid)).filter(m=>m.rid===rid&&m.tipo!=='recebi').reduce((a,m)=>a+(+m.valor||0),0);
// Distribui os pagamentos pelos trabalhos: primeiro o pago no próprio trabalho, o resto pelos mais antigos.
function allocPay(ms,rs){
 const rids=new Set(rs.map(r=>r.id)),items=[],out={};let pool=0;
 rs.forEach(r=>{const tot=jobCharge(r.id,ms);if(tot>0.004)items.push({k:r.id,data:r.data,tot,pago:0})});
 ms.forEach(m=>{if(m.tipo!=='recebi'&&!(m.rid&&rids.has(m.rid)))items.push({k:m.id,data:m.data,tot:+m.valor||0,pago:0})});
 const byK={};items.forEach(it=>byK[it.k]=it);
 ms.forEach(m=>{if(m.tipo!=='recebi')return;let x=+m.valor||0;const it=m.rid&&byK[m.rid];if(it){const u=Math.min(x,it.tot-it.pago);it.pago+=u;x-=u}pool+=x});
 items.sort((a,b)=>a.data.localeCompare(b.data)).forEach(it=>{const u=Math.min(pool,it.tot-it.pago);if(u>0){it.pago+=u;pool-=u}});
 items.forEach(it=>out[it.k]={tot:it.tot,pago:it.pago,falta:Math.max(0,it.tot-it.pago)});
 out.__sobra=pool;return out;
}

}

 const pagoH=ms.filter(m=>m.tipo==='recebi').reduce((a,m)=>a+(+m.valor||0),0);

 return `<div class="job card" onclick="openOR('${r.id}')"><div class="jh"><span class="ico sm" style="--c:${ic.c}">${I(ic.ic)}</span><div class="mid"><div class="r1"><span>${fmtD(r.data)}${r.km?' · '+fmtN(r.km)+' km':''}${who}</span><span>${r.motivo==='avaria'?'<span class="tag t-bad">Avaria</span> ':''}${recEst(r)!=='pronta'?orTag(r):''}</span></div><b>${esc(recTitle(r))}</b></div></div>${lines?`<div class="jls">${lines}</div>`:''}${r.notas?`<div class="jn">${esc(r.notas.length>140?r.notas.slice(0,140)+'…':r.notas)}</div>`:''}${foot}</div>`;

/* ================== SINCRONIZAÇÃO ENTRE APARELHOS (repositório privado GitHub) — v0.8 ================== */
// A configuração (repositório + token) fica só neste aparelho: não vai nas cópias nem no ficheiro partilhado.
const SY_FILE='garagepro-sync.json.gz',SY_COLS=['vehicles','records','clients','moves','tasks'];
let SY={cfg:{on:false,repo:'',token:'',dev:''},meta:{u:{},tomb:{},snap:{}},sha:'',etag:'',last:0,err:'',busy:false,dirty:false,timer:null,poll:null,seen:0};

// Itens partilhados: chave → objeto
function syItems(st){
 const o={};SY_COLS.forEach(c=>arr(st[c]).forEach(x=>{if(x&&x.id)o[c+':'+x.id]=x}));
 o['S:intervals']=st.intervals||{};o['S:shop']=(st.prefs||{}).shop||null;
 return o;
}
async function sySaveLocal(){const v={cfg:SY.cfg,meta:SY.meta,sha:SY.sha,last:SY.last};try{if(DBOK)await DB.set('sync',v);else localStorage.setItem('garagepro-sync',JSON.stringify(v))}catch(_){}}
async function syLoadLocal(){try{const v=DBOK?await DB.get('sync'):JSON.parse(localStorage.getItem('garagepro-sync')||'null');if(v&&typeof v==='object'){SY.cfg={...SY.cfg,...(v.cfg||{})};SY.meta={u:{},tomb:{},snap:{},...(v.meta||{})};SY.sha=v.sha||'';SY.last=v.last||0}}catch(_){}
 if(!SY.cfg.dev){SY.cfg.dev=uid();sySaveLocal()}}
// Chamado em cada save(): marca o que mudou neste aparelho
function syTrack(){
 if(!syOn())return;
 const now=Date.now(),it=syItems(S),m=SY.meta,seen=new Set();let ch=false;
 Object.entries(it).forEach(([k,x])=>{seen.add(k);const h=x==null?'∅':fnv(JSON.stringify(x));if(m.snap[k]!==h){m.snap[k]=h;m.u[k]=now;delete m.tomb[k];ch=true}});
 Object.keys(m.snap).forEach(k=>{if(!seen.has(k)){delete m.snap[k];delete m.u[k];m.tomb[k]=now;ch=true}});
 if(ch){SY.dirty=true;sySaveLocal();clearTimeout(SY.timer);SY.timer=setTimeout(()=>syncNow(),1500)}
}
// Junta o estado local com o remoto: em cada item ganha a alteração mais recente; apagados ganham se forem mais recentes
function syMerge(rem){
 const L=syItems(S),R=rem.items||{},lm=SY.meta,ru=rem.u||{},rt=rem.tomb||{},out={},u={},tomb={},changed=[];let needPush=false,localChanged=false;
 const H={};const hh=(side,k,x)=>H[side+k]||(H[side+k]=x==null?'∅':fnv(JSON.stringify(x)));
 const keys=new Set([...Object.keys(L),...Object.keys(R),...Object.keys(lm.tomb),...Object.keys(rt)]);
 keys.forEach(k=>{
  const hasL=k in L,hasR=k in R,lu=hasL?(lm.u[k]||0):-1,rU=hasR?(ru[k]||0):-1,t=Math.max(lm.tomb[k]||0,rt[k]||0);
  let src=null;
  if(hasL&&hasR){src=lu>rU?'L':rU>lu?'R':(hh('L',k,L[k])>=hh('R',k,R[k])?'L':'R')}else if(hasL)src='L';else if(hasR)src='R';
  const xu=src==='L'?lu:rU;
  if(src&&!(t&&t>=xu)){
   const x=src==='L'?L[k]:R[k],h=hh(src,k,x);out[k]=x;u[k]=Math.max(0,xu);
   if(!hasR||h!==hh('R',k,R[k])||(ru[k]||0)!==u[k])needPush=true;
   if(!hasL||h!==hh('L',k,L[k])){localChanged=true;changed.push(k)}
  }else if(t){tomb[k]=t;if(hasR||(rt[k]||0)<t)needPush=true;if(hasL){localChanged=true;changed.push(k)}}
 });
 const cut=Date.now()-180*864e5;Object.keys(tomb).forEach(k=>{if(tomb[k]<cut)delete tomb[k]});
 return{out,u,tomb,needPush,localChanged,changed};
}
function syApply(res,remSeq){
 const st={...S,vehicles:[],records:[],clients:[],moves:[],tasks:[]};
 Object.entries(res.out).forEach(([k,x])=>{const i=k.indexOf(':'),c=k.slice(0,i);if(SY_COLS.includes(c))st[c].push(x);else if(k==='S:intervals')st.intervals=x||{};else if(k==='S:shop')st.prefs={...st.prefs,shop:x||undefined}});
 if(!('S:shop' in res.out)&&st.prefs)delete st.prefs.shop;
 const seq={...((S.prefs||{}).docSeq||{})};Object.entries(remSeq||{}).forEach(([y,n])=>{seq[y]=Math.max(seq[y]||0,+n||0)});st.prefs={...st.prefs,docSeq:seq};
 S=normalize(st);
 // números de ordem repetidos (dois aparelhos ao mesmo tempo): renumera o mais recente
 const by={};S.records.forEach(r=>{if(r.orNo)(by[r.orNo]=by[r.orNo]||[]).push(r)});
 Object.values(by).filter(a=>a.length>1).forEach(a=>{a.sort((x,y)=>(res.u['records:'+x.id]||0)-(res.u['records:'+y.id]||0)||String(x.id).localeCompare(String(y.id))).slice(1).forEach(r=>{if(r.docNo===r.orNo)delete r.docNo;r.orNo=nextOrNo(r.data.slice(0,4));res.u['records:'+r.id]=Date.now();res.needPush=true})});
 // novo instantâneo: o que veio de fora não conta como alteração deste aparelho
 const it=syItems(S),snap={};Object.entries(it).forEach(([k,x])=>{snap[k]=x==null?'∅':fnv(JSON.stringify(x))});
 const u={};Object.keys(it).forEach(k=>{u[k]=res.u[k]||Date.now()});
 SY.meta={u,tomb:res.tomb,snap};
}
async function gh(path,opt={}){

}
function syErr(r){if(!r)return'Sem ligação à internet — sincroniza quando voltar';if(r.status===401)return'Token inválido ou expirado — cria um novo';if(r.status===403)return'Sem permissão (o token precisa de "Contents: Read and write") ou limite do GitHub atingido';if(r.status===404)return'Repositório não encontrado ou token sem acesso a ele';return'Erro do GitHub ('+r.status+')'}
async function syPull(){
 const r=await gh(`/repos/${SY.cfg.repo}/contents/${SY_FILE}`,{headers:SY.etag&&SY.sha?{'If-None-Match':SY.etag}:{}});
 if(r.status===304)return{same:true};
 if(r.status===404){const rr=await gh(`/repos/${SY.cfg.repo}`);if(!rr.ok)throw rr;SY.sha='';return{empty:true}}
 if(!r.ok)throw r;
 const j=await r.json();SY.etag=r.headers.get('ETag')||'';
 let b64=j.content;
 if(!b64||j.encoding==='none'){const rb=await gh(`/repos/${SY.cfg.repo}/git/blobs/${j.sha}`);if(!rb.ok)throw rb;b64=(await rb.json()).content}
 const bytes=Uint8Array.from(atob(String(b64).replace(/\s/g,'')),c=>c.charCodeAt(0));
 const txt=bytes[0]===0x1f&&bytes[1]===0x8b?await gunzipText(bytes):new TextDecoder().decode(bytes);
 const o=JSON.parse(txt);if(!o||o.app!=='GaragePro-sync')throw new Error('Ficheiro de sincronização inválido');
 return{sha:j.sha,rem:o};
}
async function syPush(){
 const it=syItems(S);const o={app:'GaragePro-sync',v:1,appVer:APP_VER,build:APP_BUILD,at:Date.now(),dev:SY.cfg.dev,items:it,u:SY.meta.u,tomb:SY.meta.tomb,docSeq:(S.prefs||{}).docSeq||{}};

 if(r.status===409||r.status===422)return false; // alguém gravou entretanto
 if(!r.ok)throw r;
 const j=await r.json();SY.sha=j.content&&j.content.sha||'';SY.etag='';SY.dirty=false;return true;
}

const syOutdated=()=>APP_BUILD>0&&!!SY.remVer&&SY.remVer.build>APP_BUILD;
let _syOutNote=false;

async function syncNow(manual){
 if(!syOn()||SY.busy)return;if(navigator.onLine===false){SY.err=syErr(null);if(manual)render();return}
 SY.busy=true;let changed=false;
 try{
  for(let tries=0;tries<4;tries++){
   const p=await syPull();
   if(p.rem)SY.remVer={ver:String(p.rem.appVer||''),build:+p.rem.build||0};
   if(syOutdated()){syOnOutdated();break}
   if(p.rem){SY.sha=p.sha;const res=syMerge(p.rem);
    if(res.localChanged||res.needPush){syApply(res,p.rem.docSeq);if(res.localChanged){changed=true;await saveQuiet();try{syNotifyChanges(res.changed.map(k=>k.startsWith('S:')?'S:'+k:k),!SY.firstDone)}catch(_){}}}
    SY.dirty=res.needPush}
   else if(p.empty){SY.dirty=true}
   if(!SY.dirty)break;
   if(await syPush())break;
   SY.etag='';
  }
  SY.last=Date.now();SY.err='';
 }catch(e){SY.err=e instanceof Response?syErr(e):(e&&e.name==='TypeError'?syErr(null):String(e&&e.message||e).slice(0,120))}
 finally{SY.busy=false;SY.firstDone=true;sySaveLocal();try{pcStatus()}catch(_){}}
 if(changed){if(syQuiet())render();else toast('Dados atualizados a partir do outro aparelho')}
 else if(manual||(stack[stack.length-1]||{}).v==='sync')render();
}

async function syOnSetup(){

 const repo=(SYF.repo||'').replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,''),token=SYF.token||'';
 if(!/^[\w.-]+\/[\w.-]+$/.test(repo))return toast('Escreve o repositório como utilizador/nome');
 if(!/^(github_pat_|ghp_)[\w]{20,}$/.test(token))return toast('O token não parece válido');
 SY.cfg={...SY.cfg,repo,token,on:false};toast('A verificar…');
 try{
  const r=await gh(`/repos/${repo}`);if(!r.ok){toast(syErr(r));return}
  const j=await r.json();
  if(!j.private){toast('Esse repositório é público. Os dados dos clientes têm de ficar num repositório privado.');SY.cfg.token='';return}
  if(j.permissions&&j.permissions.push===false){toast('O token não tem permissão de escrita (Contents: Read and write)');return}
 }catch(_){toast(syErr(null));return}
 await autoBackup('Antes de ligar a sincronização');
 SY.cfg.on=true;SY.meta={u:{},tomb:{},snap:{}};SY.sha='';SY.etag='';SY.err='';
 // primeiro registo: tudo o que existe aqui conta como "de agora" com data antiga, para não apagar nada do outro aparelho
 const it=syItems(S);Object.entries(it).forEach(([k,x])=>{SY.meta.snap[k]=x==null?'∅':fnv(JSON.stringify(x));SY.meta.u[k]=1});
 SY.dirty=true;SYF=null;await sySaveLocal();syStart();render();await syncNow(true);
 if(!SY.err)toast('Sincronização ligada');
}
async function syOff(){if(!confirm('Desligar a sincronização neste aparelho?'))return;SY.cfg={...SY.cfg,on:false,token:''};SY.err='';clearInterval(SY.poll);await sySaveLocal();render();toast('Sincronização desligada')}

const NT_ACT={};let NT_N=0;
// o: {icon, tone:'pri'|'ok'|'warn'|'bad', title, text, actions:[{label, primary, fn}], timeout(ms), os:true → também no Windows se a janela não estiver em foco}
function notify(o){
 let box=$('#ntbox');if(!box){box=document.createElement('div');box.id='ntbox';box.setAttribute('aria-live','polite');document.body.appendChild(box)}
 const id='nt'+(++NT_N);NT_ACT[id]=(o.actions||[]).map(a=>a.fn);
 const el=document.createElement('div');el.className='ntc';el.dataset.tone=o.tone||'pri';el.id=id;
 el.innerHTML=`<span class="nti">${I(o.icon||'bell')}</span><div class="ntm"><b>${esc(o.title||'')}</b>${o.text?`<small>${esc(o.text)}</small>`:''}${(o.actions||[]).length?`<div class="nta">${o.actions.map((a,i)=>`<button class="${a.primary?'p':''}" onclick="ntAct('${id}',${i})">${esc(a.label)}</button>`).join('')}</div>`:''}</div><button class="ntx" onclick="ntClose('${id}')" aria-label="Fechar">${I('x','s')}</button>`;
 box.prepend(el);requestAnimationFrame(()=>el.classList.add('show'));
 [...box.children].slice(4).forEach(x=>x.remove());
 if(o.timeout!==0)setTimeout(()=>ntClose(id),o.timeout||7000);
 if(o.os&&isPC()){try{window.gpDesktop.isFocused().then(f=>{if(!f)window.gpDesktop.notify({title:o.title,body:o.text||''})})}catch(_){}}
 return id;
}
function ntAct(id,i){const f=(NT_ACT[id]||[])[i];ntClose(id);if(typeof f==='function')f()}
function ntClose(id){const el=$('#'+id);delete NT_ACT[id];if(!el)return;el.classList.remove('show');el.classList.add('out');setTimeout(()=>el.remove(),260)}

let TK=null;
const taskVeh=t=>veh(t.vid);
function prazoInfo(t){
 if(!t.prazo||t.feito)return null;
 const d=Math.round((pd(t.prazo)-today0())/864e5);
 if(d<0)return{c:'t-bad',t:'Atrasada '+fmtDur(-d)};
 if(d===0)return{c:'t-warn',t:'Hoje'};
 if(d===1)return{c:'t-warn',t:'Amanhã'};
 return{c:'t-mut',t:'Até '+fmtD(t.prazo)};
}
function sortTasks(a,b){
 if(a.feito!==b.feito)return a.feito?1:-1;
 if(a.feito)return(b.feitoEm||'').localeCompare(a.feitoEm||'');
 const u=(b.prio==='urgente')-(a.prio==='urgente');if(u)return u;
 const pa=a.prazo||'9999',pb=b.prazo||'9999';if(pa!==pb)return pa.localeCompare(pb);
 return(a.criado||'').localeCompare(b.criado||'');
}
const pendTasks=vid=>S.tasks.filter(t=>!t.feito&&(vid===undefined||t.vid===vid));

 const v=taskVeh(t),c=v&&cli(v.owner),p=prazoInfo(t),ps=arr(t.passos),nd=ps.filter(x=>x.f).length;
 const who=showVeh?(v?vName(v)+(c?' · '+c.nome:''):'Geral'):'';
 const tags=[t.prio==='urgente'&&!t.feito?'<span class="tag t-bad">Urgente</span>':'',p?`<span class="tag ${p.c}">${p.t}</span>`:'',ps.length?`<span class="tag ${nd===ps.length?'t-ok':'t-mut'}">${I('check','s')} ${nd}/${ps.length} passos</span>`:'',t.feito&&t.feitoEm?`<span class="tag t-mut">Feita a ${fmtD(t.feitoEm)}</span>`:''].filter(Boolean).join('');
 return `<div class="row card task${t.feito?' done':''}${t.prio==='urgente'&&!t.feito?' urg':''}" onclick="taskSheet('${t.id}')"><button class="ck-b${t.feito?' on':''}" onclick="event.stopPropagation();toggleTask('${t.id}')">${I('check')}</button><div class="mid"><b>${esc(t.titulo)}</b>${who?`<small>${esc(who)}</small>`:''}${tags?`<div class="tgs">${tags}</div>`:''}</div>${t.notas?`<span class="c-mut">${I('list','s')}</span>`:''}</div>`;
}

function sugBar(sg,vid){
 if(!sg.length)return'';
 return `<div class="list mt one"><button class="row card sugbar" onclick="sugSheet(${vid?`'${vid}'`:''})"><span class="bub b-warn">${I('bell')}</span><div class="mid"><b>${sg.length} sugest${sg.length>1?'ões':'ão'} dos avisos</b><small>${esc(sg.slice(0,2).map(d=>CAT[d.key].n).join(', '))}${sg.length>2?'…':''}</small></div>${I('chev')}</button></div>`;
}
function sugSheet(vid){
 const sg=suggestions(vid);if(!sg.length){closeSheet();render();return}
 openSheet(`<h3>Sugestões dos avisos</h3><p class="hint">Peças dos teus carros que estão a chegar à troca. Toca em + para passar a tarefa.</p><div style="margin-top:10px">${sg.map(sugRow).join('')}</div>
  <button class="btn ghost sm" onclick="sg_all(${vid?`'${vid}'`:''})">${I('plus','s')} Adicionar todas</button>`);
}
function addSug(vid,key){
 const d=due(veh(vid),key);
 S.tasks.push({id:uid(),titulo:'Trocar '+CAT[key].n.toLowerCase(),vid,prio:d&&d.st==='bad'?'urgente':'normal',prazo:'',notas:'',feito:false,criado:todayISO(),feitoEm:'',sug:vid+':'+key,passos:[]});
 save();render();toast('Tarefa adicionada');
 if($('#sheet'))sugSheet(UI.vtab==='tar'&&stack[stack.length-1].v==='veh'?stack[stack.length-1].id:undefined);
}
function sg_all(vid){suggestions(vid).forEach(d=>{const x=due(d.v,d.key);S.tasks.push({id:uid(),titulo:'Trocar '+CAT[d.key].n.toLowerCase(),vid:d.v.id,prio:x&&x.st==='bad'?'urgente':'normal',prazo:'',notas:'',feito:false,criado:todayISO(),feitoEm:'',sug:d.v.id+':'+d.key,passos:[]})});save();closeSheet();render();toast('Tarefas adicionadas')}
function tkSeg(list){
 if(UI.tkF!=='feitas')UI.tkF='porfazer';
 const np=list.filter(t=>!t.feito).length,nd=list.length-np;
 return `<div class="wrap" style="padding-top:10px"><div class="seg">${[['porfazer','Por fazer',np],['feitas','Feitas',nd]].map(x=>`<button class="${UI.tkF===x[0]?'on':''}" onclick="UI.tkF='${x[0]}';render()">${x[1]} <span class="cnt">${x[2]}</span></button>`).join('')}</div></div>`;
}
// Lista agrupada por carro (ou sem grupos dentro de um carro)
function tasksGrouped(list,grouped){
 const done=UI.tkF==='feitas',ts=list.filter(t=>!!t.feito===done).sort(sortTasks);
 if(!ts.length)return `<div class="empty sm" style="padding-top:26px">${done?'Ainda nenhuma tarefa feita.':I('check','s')+' Nada por fazer.'}</div>`;
 let h='';
 if(!grouped)h=`<div class="list mt">${ts.map(t=>taskRow(t,false)).join('')}</div>`;
 else{
  const gs=new Map();ts.forEach(t=>{const k=veh(t.vid)?t.vid:'';if(!gs.has(k))gs.set(k,[]);gs.get(k).push(t)});
  const keys=[...gs.keys()].sort((a,b)=>(a===''?1:0)-(b===''?1:0)||(gs.get(b).some(t=>t.prio==='urgente')-gs.get(a).some(t=>t.prio==='urgente'))||vName(veh(a)||{}).localeCompare(vName(veh(b)||{})));
  keys.forEach(k=>{const v=veh(k),c=v&&cli(v.owner),g=gs.get(k);
   h+=`<div class="tgh"${v?` onclick="openVeh('${v.id}','tar')"`:''}><span class="ico sm" style="--c:${v?'var(--pri)':'#64748b'}">${I(v?'car':'list')}</span><div class="mid"><b>${v?esc(vName(v)):'Geral'}</b><small>${v?(c?esc(c.nome):'Meu')+(v.matricula?' · '+esc(v.matricula):''):'Sem carro'}</small></div><span class="cnt">${g.length}</span>${v?I('chev','s'):''}</div><div class="list">${g.map(t=>taskRow(t,false)).join('')}</div>`});
 }
 if(done)h+=`<div class="wrap"><button class="btn ghost sm" onclick="clearDone(${grouped?'':`'${list[0]?.vid||''}'`})">${I('trash','s')} Limpar feitas</button></div>`;
 return h;
}
function vTasks(){
 const all=S.tasks;
 let h=hdr('Tarefas',`<button class="ib pri" onclick="taskSheet()">${I('plus')}</button>`,true);
 if(!all.length&&!suggestions().length)return h+emptyBox('list','Sem tarefas.<br>Anota aqui o que tens de fazer nos carros.',`<button class="btn ghost sm" onclick="taskSheet()">Nova tarefa</button>`);
 h+=tkSeg(all);
 if(UI.tkF!=='feitas')h+=sugBar(suggestions());
 h+=tasksGrouped(all,true);
 return h+'<div style="height:10px"></div>';
}
function vehTasks(v){
 const ts=S.tasks.filter(t=>t.vid===v.id);
 let h=tkSeg(ts);
 if(UI.tkF!=='feitas')h+=sugBar(suggestions(v.id),v.id);
 h+=ts.length?tasksGrouped(ts,false):emptyBox('list','Sem tarefas para este carro.');
 h+=`<button class="fab" onclick="taskSheet(null,'${v.id}')">${I('plus')}</button>`;
 return h;
}
function clearDone(vid){
 const n=S.tasks.filter(t=>t.feito&&(vid===undefined||t.vid===vid)).length;
 if(!n||!confirm(`Apagar ${n} tarefa(s) feita(s)?`))return;
 S.tasks=S.tasks.filter(t=>!(t.feito&&(vid===undefined||t.vid===vid)));save();render();
}
function toggleTask(id){
 const t=S.tasks.find(x=>x.id===id);if(!t)return;
 if(t.feito){t.feito=false;t.feitoEm='';save();render();toast('Tarefa reaberta');return}
 if(veh(t.vid))return doneSheet(id);
 t.feito=true;t.feitoEm=todayISO();save();render();toast('Tarefa feita ✓');
}
function doneSheet(id){
 const t=S.tasks.find(x=>x.id===id);if(!t)return;
 const ps=arr(t.passos),falta=ps.filter(x=>!x.f).length;
 openSheet(`<h3>Concluir tarefa</h3><p class="hint" style="font-size:14.5px;color:var(--tx)"><b>${esc(t.titulo)}</b><br><span class="c-mut">${esc(vName(veh(t.vid)))}</span></p>
  ${falta?`<div class="note" style="margin:12px 0 0">${I('alert')}<span>Faltam ${falta} de ${ps.length} passos.</span></div>`:''}
  <button class="btn" onclick="taskToRep('${id}')">${I('wrench')} Registar a reparação</button>
  <p class="hint">Abre a reparação já preenchida (peças, valores). A tarefa fica feita quando guardares.</p>
  <button class="btn ghost sm" onclick="markDone('${id}')">${I('check','s')} Só marcar como feita</button>`);
}
function markDone(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;t.feito=true;t.feitoEm=todayISO();save();closeSheet();TK=null;render();toast('Tarefa feita ✓')}
function taskSheet(id,vid){
 const t=id?S.tasks.find(x=>x.id===id):null;
 TK=t?{...t,passos:arr(t.passos).map(p=>({...p}))}:{id:null,titulo:'',vid:vid||'',prio:'normal',prazo:'',notas:'',feito:false,passos:[]};
 tkRender(false);
 if(!t)setTimeout(()=>{const e=$('#tk-t');e&&e.focus()},260);
}
function tkStep(i){
 TK.passos[i].f=!TK.passos[i].f;
 if(TK.id){const t=S.tasks.find(x=>x.id===TK.id);if(t&&t.passos&&t.passos[i]&&t.passos[i].t===TK.passos[i].t){t.passos[i].f=TK.passos[i].f;save();render()}}
 tkRender();
}
function tkAddStep(){TK.passos.push({t:'',f:false});tkRender();setTimeout(()=>{const a=document.querySelectorAll('.tsteps input');a.length&&a[a.length-1].focus()},30)}
function tkRender(noAnim=true){
 const e=!!TK.id,o=(val,txt)=>`<option value="${val}" ${TK.vid===val?'selected':''}>${esc(txt)}</option>`;
 const ps=TK.passos||[];
 openSheet(`<h3>${e?(TK.feito?'Tarefa feita':'Tarefa'):'Nova tarefa'}</h3>
  <label class="fl">O que é preciso fazer</label><div class="in"><input id="tk-t" value="${esc(TK.titulo)}" oninput="TK.titulo=this.value" placeholder="Ex: Trocar pastilhas da frente"></div>
  <label class="fl">Veículo</label><div class="in">${I('car')}<select onchange="TK.vid=this.value">${o('','Geral (sem carro)')}${vehOptions(TK.vid)}</select>${CHV}</div>
  <label class="fl">Passos <small class="c-mut">opcional</small></label>
  <div class="tsteps">${ps.map((p,i)=>`<div class="step${p.f?' on':''}"><button class="ck-b${p.f?' on':''}" onclick="tkStep(${i})">${I('check')}</button><input value="${esc(p.t)}" placeholder="Ex: desmontar roda" oninput="TK.passos[${i}].t=this.value"><button class="ib" onclick="TK.passos.splice(${i},1);tkRender()">${I('x','s')}</button></div>`).join('')}
  <button class="lnk" style="margin:6px 0 0" onclick="tkAddStep()">${I('plus','s')} Adicionar passo</button></div>
  <div class="grid2 np"><div><label class="fl">Prioridade</label><div class="seg" style="height:50px">${[['normal','Normal'],['urgente','Urgente']].map(x=>`<button class="${TK.prio===x[0]?'on'+(x[0]==='urgente'?' bad':''):''}" onclick="TK.prio='${x[0]}';tkRender()">${x[1]}</button>`).join('')}</div></div>
  <div><label class="fl">Prazo</label><div class="in"><input type="date" value="${TK.prazo}" onchange="TK.prazo=this.value"></div></div></div>
  <label class="fl">Notas</label><textarea class="ta" oninput="TK.notas=this.value" placeholder="Ex: pedir peça à loja, ver folga do rolamento...">${esc(TK.notas)}</textarea>
  <button class="btn" onclick="saveTask()">${I('check')} Guardar</button>
  ${e?`<button class="btn ghost sm" onclick="saveTask(true)">${I(TK.feito?'history':'check','s')} ${TK.feito?'Reabrir tarefa':'Concluir tarefa'}</button><button class="btn danger" onclick="delTask()">Apagar tarefa</button>`:''}`,noAnim);
}
function saveTask(toggle){
 if(lock('saveTask'))return;
 if(!TK.titulo.trim())return toast('Escreve o que é preciso fazer');
 const t={...TK,titulo:TK.titulo.trim(),notas:(TK.notas||'').trim(),passos:(TK.passos||[]).map(p=>({t:p.t.trim(),f:!!p.f})).filter(p=>p.t)};
 if(!t.id){t.id=uid();t.criado=todayISO();t.feitoEm=''}
 const i=S.tasks.findIndex(x=>x.id===t.id);
 if(i>=0)S.tasks[i]=t;else S.tasks.push(t);
 save();
 if(toggle){
  if(t.feito){t.feito=false;t.feitoEm='';save();closeSheet();TK=null;render();return toast('Tarefa reaberta')}
  if(veh(t.vid)){TK=null;render();return doneSheet(t.id)}
  return markDone(t.id);
 }
 closeSheet();TK=null;render();toast('Tarefa guardada');
}
function guessTipo(title){
 const tw=new Set(fold(title).split(/[^a-z0-9]+/).filter(Boolean));let best='',bs=0,bm=0;
 Object.keys(CAT).forEach(k=>{const ws=fold(CAT[k].n.replace(/\s*\(.*?\)/g,'')).split(/[^a-z0-9]+/).filter(w=>w.length>2);if(!ws.length||!tw.has(ws[0]))return;
  const m=ws.filter(w=>tw.has(w)).length,sc=m/ws.length;if(sc>bs||(sc===bs&&m>bm)){best=k;bs=sc;bm=m}});
 return best;
}
function taskToRep(id){
 const t=S.tasks.find(x=>x.id===id);if(!t||!veh(t.vid))return;
 closeSheet();TK=null;
 newRep(t.vid);F.taskId=t.id;
 const ps=arr(t.passos);
 F.notas=[t.notas,ps.length?ps.map(p=>(p.f?'✓ ':'• ')+p.t).join('\n'):''].filter(Boolean).join('\n');
 const k=(t.sug&&t.sug.split(':')[1])||guessTipo(t.titulo);
 if(k&&CAT[k])F.tipo=k;else{F.tipo='outro';F.titulo=t.titulo.slice(0,80)}
 render();toast('Regista a reparação — a tarefa fica feita ao guardar');
}
function delTask(){if(!confirm('Apagar esta tarefa?'))return;S.tasks=S.tasks.filter(t=>t.id!==TK.id);save();closeSheet();TK=null;render();toast('Apagada')}

/* ================== 1. LEMBRETE DE CÓPIA ================== */
const daysSince=s=>{if(!s)return null;const t=new Date(s);return isNaN(t)?null:Math.floor((Date.now()-t)/864e5)};
function bakDue(){
 const p=S.prefs||{};if(!(S.vehicles.length+S.records.length+S.moves.length))return 0;
 if(p.bakSnooze&&p.bakSnooze>todayISO())return 0;
 const d=daysSince(p.lastExport);if(d===null){const f=daysSince(p.firstUse);return f!==null&&f>=7?-1:0}
 return d>=30?d:0;
}
function bakBanner(){
 const d=bakDue();if(!d)return'';
 return `<div class="wrap"><div class="card bakb"><span class="bub b-warn">${I('download')}</span><div class="mid"><b>${d<0?'Ainda não fizeste nenhuma cópia':'A última cópia foi há '+d+' dias'}</b><small>Se perderes o telemóvel, perdes os dados. Guarda uma cópia no Drive.</small></div></div>
  <div class="grid2 np" style="margin-top:8px"><button class="btn sm" style="margin:0" onclick="exportData()">${I('download','s')} Exportar agora</button><button class="btn ghost sm" style="margin:0" onclick="snoozeBak()">Lembrar amanhã</button></div></div>`;
}
function snoozeBak(){const t=new Date();t.setDate(t.getDate()+1);S.prefs={...S.prefs,bakSnooze:iso(t)};save();render()}
function markExported(){S.prefs={...S.prefs,lastExport:new Date().toISOString(),bakSnooze:''};save();render()}

let SND=null;
const phoneWA=t=>{let d=String(t||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.length===9&&/^[29]/.test(d))d='351'+d;return d.length>=11?d:''};
function openExt(url){const B=plug('Browser');if(B&&B.open)B.open({url});else window.open(url,'_blank','noopener')}
async function copyText(t){
 try{await navigator.clipboard.writeText(t);return true}catch(_){}
 try{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(_){return false}
}
function accountText(cid,o){
 const c=cli(cid);if(!c)return'';
 const vs=S.vehicles.filter(v=>v.owner===cid);
 let ms=cMoves(cid).filter(m=>o.vid==='all'||m.vid===o.vid).sort((a,b)=>a.data.localeCompare(b.data)||String(a.id).localeCompare(String(b.id)));
 if(o.desde==='acerto'){let run=0,cut=0;ms.forEach((m,i)=>{run+=m.tipo==='recebi'?-m.valor:m.valor;if(Math.abs(run)<=0.004)cut=i+1});ms=ms.slice(cut)}
 const b=bal(ms),showV=o.vid==='all'&&vs.length>1;
 const vtxt=v=>v?vName(v)+(v.matricula?' ('+v.matricula+')':''):'';
 const line=m=>`• ${fmtD(m.data).slice(0,5)} ${m.desc||MT[m.tipo].def} — ${fmtE(m.valor)}${showV&&veh(m.vid)?' ['+vName(veh(m.vid))+']':''}`;
 const grp=(tit,t)=>{const x=ms.filter(m=>m.tipo===t);return x.length?`*${tit}*\n${x.map(line).join('\n')}\n\n`:''};
 const nome=c.nome.split(' ')[0]==='Sr.'||c.nome.split(' ')[0]==='Sra.'?c.nome:c.nome.split(' ')[0];
 let t=`Olá ${nome},\n\nResumo da conta${o.vid!=='all'&&veh(o.vid)?' — '+vtxt(veh(o.vid)):''}:\n\n`;
 if(!ms.length)t+='Não há valores em aberto. Está tudo pago. 👍\n';
 else{
  t+=grp('Peças','comprei')+grp('Mão de obra / serviços','cobrar')+grp('Pagamentos recebidos','recebi');
  t+=`Total: ${fmtE(b.tot)}\nJá pago: ${fmtE(b.rec)}\n`;
  t+=b.s>0.004?`*Falta pagar: ${fmtE(b.s)}*\n`:b.s<-0.004?`*A seu favor (adiantado): ${fmtE(-b.s)}*\n`:'*Está tudo pago.* 👍\n';
 }
 if(o.manut){
  const ds=(o.vid==='all'?vs:[veh(o.vid)].filter(Boolean)).flatMap(v=>toPropose(v).map(d=>({v,d})));
  if(ds.length)t+=`\n*Manutenção a prever*\n${ds.map(({v,d})=>`• ${CAT[d.key].n}${showV||o.vid==='all'&&vs.length>1?' ('+vName(v)+')':''} — ${d.text.toLowerCase()}`).join('\n')}\n`;
 }
 return t+'\nObrigado!';
}
function sendSheet(cid,o={}){
 const vs=S.vehicles.filter(v=>v.owner===cid);
 SND={cid,vid:o.vid||(vs.length===1?vs[0].id:'all'),desde:o.desde||'acerto',manut:o.manut!==undefined?o.manut:false,txt:null};
 sndRender(false);
}
function sndRender(noAnim=true){
 const c=cli(SND.cid);if(!c)return;
 const vs=S.vehicles.filter(v=>v.owner===SND.cid);
 if(SND.txt===null)SND.txt=accountText(SND.cid,SND);
 const wa=phoneWA(c.tel);
 openSheet(`<h3>Enviar conta a ${esc(c.nome)}</h3>
  ${vs.length>1?`<label class="fl">Carro</label><div class="in">${I('car')}<select onchange="SND.vid=this.value;SND.txt=null;sndRender()"><option value="all" ${SND.vid==='all'?'selected':''}>Todos os carros</option>${vs.map(v=>`<option value="${v.id}" ${SND.vid===v.id?'selected':''}>${esc(vName(v))}</option>`).join('')}</select>${CHV}</div>`:''}
  <label class="fl">O que incluir</label><div class="seg">${[['acerto','Desde o último acerto'],['tudo','Tudo']].map(([k,t])=>`<button class="${SND.desde===k?'on':''}" onclick="SND.desde='${k}';SND.txt=null;sndRender()">${t}</button>`).join('')}</div>
  <div class="seg" style="margin-top:8px">${[[false,'Só valores'],[true,'+ Manutenção a prever']].map(([k,t])=>`<button class="${SND.manut===k?'on':''}" onclick="SND.manut=${k};SND.txt=null;sndRender()">${t}</button>`).join('')}</div>
  <label class="fl">Mensagem (podes alterar)</label><textarea class="ta msg" oninput="SND.txt=this.value">${esc(SND.txt)}</textarea>
  <div class="grid2 np" style="margin-top:14px"><button class="btn sm wab" style="margin:0" onclick="sndWA()">${I('chat','s')} WhatsApp</button><button class="btn ghost sm" style="margin:0" onclick="sndShare()">${I('upload','s')} Partilhar</button></div>
  <button class="btn ghost sm" onclick="sndCopy()">${I('list','s')} Copiar texto</button>
  ${wa?'':`<p class="hint">${c.tel?'O telefone do cliente não parece português nem internacional':'Este cliente não tem telefone'}: o WhatsApp abre para escolheres o contacto.</p>`}`,noAnim);
}
function sndWA(){const c=cli(SND.cid),n=phoneWA(c&&c.tel);openExt(`https://wa.me/${n}?text=${encodeURIComponent(SND.txt)}`)}
async function sndShare(){
 const SH=plug('Share');
 try{if(SH&&SH.share){await SH.share({title:'Conta',text:SND.txt,dialogTitle:'Enviar conta'});return}if(navigator.share){await navigator.share({text:SND.txt});return}}catch(e){if(/cancel|abort/i.test(String(e&&(e.message||e.name))))return}
 sndCopy();
}
async function sndCopy(){toast(await copyText(SND.txt)?'Texto copiado':'Não foi possível copiar')}

/* ================== 3. PESQUISA ================== */
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const plateKey=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function searchHTML(q){
 const n=norm(q.trim()),pk=plateKey(q);
 if(n.length<2)return `<div class="empty sm">Escreve pelo menos 2 letras: matrícula, cliente, peça, nota…</div>`;
 const has=(...xs)=>xs.some(x=>norm(x).includes(n));
 const vs=S.vehicles.filter(v=>has(v.marca,v.modelo,vName(v),v.motor)||(pk.length>=2&&plateKey(v.matricula).includes(pk))).slice(0,20);
 const cs=S.clients.filter(c=>has(c.nome,c.tel,c.notas)).slice(0,20);
 const rs=S.records.filter(r=>has(recTitle(r),r.notas,...arr(r.pecas).map(p=>p.nome),...arr(r.pecas).map(p=>CAT[p.key]?CAT[p.key].n:''))).sort(sortRecs).slice(0,20);
 const ts=S.tasks.filter(t=>has(t.titulo,t.notas)).sort(sortTasks).slice(0,20);
 const ms=S.moves.filter(m=>has(m.desc)).sort(sortMoves).slice(0,20);
 if(!vs.length&&!cs.length&&!rs.length&&!ts.length&&!ms.length)return emptyBox('search','Nada encontrado para "'+esc(q.trim())+'".');
 const sec=(t,x,f)=>x.length?`<div class="sec"><h2>${t} <span class="cnt">${x.length}</span></h2></div><div class="list">${x.map(f).join('')}</div>`:'';
 return sec('Veículos',vs,v=>vRow(v))+sec('Clientes',cs,c=>`<div class="row card" onclick="openCli('${c.id}')"><span class="av">${ini(c.nome)}</span><div class="mid"><b>${esc(c.nome)}</b><small>${esc(c.tel||'Sem telefone')}</small></div>${stTag(cBal(c.id))}</div>`)
  +sec('Reparações',rs,r=>{const ic=recIcon(r),v=veh(r.vid);return `<div class="row card" onclick="openOR('${r.id}')"><span class="ico sm" style="--c:${ic.c}">${I(ic.ic)}</span><div class="mid"><b>${esc(recTitle(r))}</b><small>${fmtD(r.data)} · ${esc(v?vName(v):'')}${r.km?' · '+fmtN(r.km)+' km':''}</small></div></div>`})
  +sec('Tarefas',ts,t=>taskRow(t))+sec('Movimentos',ms,m=>moveRow(m));
}
function vSearch(){
 let h=`<header class="hdr"><div class="hl"><button class="ib" onclick="back()">${I('back')}</button></div><div class="in" style="flex:1;height:44px">${I('search')}<input id="q" type="search" placeholder="Matrícula, cliente, peça…" value="${esc(UI.q||'')}" oninput="UI.q=this.value;$('#sres').innerHTML=searchHTML(this.value);a11y($('#sres'))" autocomplete="off"></div></header>`;
 h+=`<div id="sres">${searchHTML(UI.q||'')}</div><div style="height:10px"></div>`;
 setTimeout(()=>{const e=$('#q');if(e&&document.activeElement!==e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}},60);
 return h;
}

/* ================== 5. BLOQUEIO COM PIN ================== */
const b64e=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pinHash(pin,saltB64){
 const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
 return b64e(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64d(saltB64),iterations:150000,hash:'SHA-256'},k,256));
}

 const d=document.createElement('div');d.id='lock';document.body.appendChild(d);lkRender();
}
function lkRender(msg){
 const d=$('#lock');if(!d)return;const p=S.prefs.pin,len=p.len||4,wait=lkWait();
 d.innerHTML=`<div class="lkbox"><img class="lgimg" src="${LOGO}" alt="GaragePro"><h2>GaragePro</h2><p class="hint" id="lkmsg">${msg||(wait?'Demasiadas tentativas. Espera '+wait+' s.':'Introduz o PIN')}</p>
  <div class="dots">${Array.from({length:len},(_,i)=>`<i class="${i<LK.buf.length?'on':''}"></i>`).join('')}</div>
  <div class="kp">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button aria-label="${k==='⌫'?'Apagar dígito':k}" onclick="lkKey('${k}')">${k}</button>`).join('')}</div>
  <button class="lkforgot" onclick="lkForgot()">Esqueci-me do PIN</button></div>`;
 if(wait)setTimeout(()=>{if($('#lock')&&!LK.buf)lkRender()},1000);

function lkWait(){const u=+((S.prefs||{}).pinUntil||0);return u>Date.now()?Math.ceil((u-Date.now())/1000):0}
async function lkKey(k){
 if(LK.busy||lkWait())return;
 const p=S.prefs.pin,len=p.len||4;
 if(k==='⌫'){LK.buf=LK.buf.slice(0,-1);return lkRender()}
 if(LK.buf.length>=len)return;
 LK.buf+=k;lkRender();
 if(LK.buf.length<len)return;
 LK.busy=true;const ok=(await pinHash(LK.buf,p.salt))===p.hash;LK.busy=false;
 if(ok){S.prefs={...S.prefs,pinFails:0,pinUntil:0};save();$('#lock')&&$('#lock').remove();return}
 const f=(+S.prefs.pinFails||0)+1,until=f>=5?Date.now()+Math.min(300,30*2**(f-5))*1000:0;
 S.prefs={...S.prefs,pinFails:f,pinUntil:until};save();LK.buf='';
 lkRender(until?`PIN errado. Espera ${Math.ceil((until-Date.now())/1000)} s.`:`PIN errado (${f} de 5 tentativas)`);
 const dots=$('#lock .dots');dots&&dots.classList.add('shake');
}

/* ================== CÓPIAS E PASSAGEM DE DADOS ================== */
// Formato .garagepro = JSON comprimido (gzip). A importação aceita também .json antigos.
const canGzip=()=>typeof CompressionStream!=='undefined'&&typeof DecompressionStream!=='undefined';
const exportPayload=(withPhotos=true)=>{const o={app:'GaragePro',appVer:APP_VER,exportado:new Date().toISOString(),...S};if(!withPhotos)o.vehicles=o.vehicles.map(v=>({...v,foto:''}));return o};
async function gzipBytes(str){const s=new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));return new Uint8Array(await new Response(s).arrayBuffer())}
async function gunzipText(buf){const s=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(s).text()}
function bytesB64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
async function buildBackup(withPhotos=true){
 const json=JSON.stringify(exportPayload(withPhotos));
 if(canGzip()){const b=await gzipBytes(json);return{bytes:b,ext:'garagepro',mime:'application/octet-stream',size:b.length,raw:json.length}}
 const b=new TextEncoder().encode(json);return{bytes:b,ext:'json',mime:'application/json',size:b.length,raw:json.length};
}
const fmtSize=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1).replace('.',',')+' MB';
async function exportData(withPhotos=true){
 let bk;try{bk=await buildBackup(withPhotos)}catch(_){return toast('Não foi possível criar a cópia')}
 const name=`garagepro-${todayISO()}.${bk.ext}`;
 const FS=plug('Filesystem'),SH=plug('Share');
 if(isNative()&&FS&&SH){
  try{const w=await FS.writeFile({path:name,data:bytesB64(bk.bytes),directory:'CACHE'});await SH.share({title:'Cópia GaragePro',text:name,url:w.uri,dialogTitle:'Enviar cópia (Quick Share, WhatsApp, Drive…)'});markExported();toast('Cópia enviada');return}
  catch(e){if(/cancel/i.test(String(e&&e.message||e)))return;toast('Não foi possível partilhar a cópia')}
  return;
 }
 const blob=new Blob([bk.bytes],{type:bk.mime});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);markExported();toast('Cópia guardada nas Transferências');
}
async function importFile(f){
 if(!f)return;
 if(f.size>60*1024*1024)return toast('Ficheiro demasiado grande');
 const bad='Este ficheiro não é uma cópia da GaragePro';
 let txt;
 try{const buf=new Uint8Array(await f.arrayBuffer());txt=buf[0]===0x1f&&buf[1]===0x8b?await gunzipText(buf):new TextDecoder().decode(buf)}catch(_){return toast(bad)}
 let o;try{o=JSON.parse(txt)}catch(_){return toast(bad)}
 if(!o||typeof o!=='object'||!Array.isArray(o.vehicles)||!Array.isArray(o.records))return toast(bad);
 let n;try{n=normalize(JSON.parse(JSON.stringify(o)))}catch(_){return toast('A cópia está danificada')}
 importSheet(n,o,f.name);
}

 try{
  const bk=await buildBackup(true),name=`garagepro-auto-${todayISO()}.${bk.ext}`;
  await FS.writeFile({path:`${AUTO_DIR}/${name}`,data:bytesB64(bk.bytes),directory:'DOCUMENTS',recursive:true});
  try{const r=await FS.readdir({path:AUTO_DIR,directory:'DOCUMENTS'});const fs=(r.files||[]).map(x=>typeof x==='string'?x:x.name).filter(n=>/^garagepro-auto-\d{4}-\d{2}-\d{2}\./.test(n)).sort();

}

/* ================== ATUALIZAÇÕES (APK via GitHub Releases) ================== */
// APP_BUILD e UPDATE_REPO são preenchidos automaticamente pelo GitHub Actions ao gerar o APK.
const APP_BUILD=0;
const UPDATE_REPO='__REPO__';
const isNative=()=>!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const plug=n=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins[n];
const repoOK=()=>/^[\w.-]+\/[\w.-]+$/.test(UPDATE_REPO);
let UP={st:'idle',rel:null,err:''};
const buildOf=tag=>{const m=String(tag||'').match(/-b(\d+)$/);return m?+m[1]:0};
const verOf=tag=>String(tag||'').replace(/^v/,'').replace(/-b\d+$/,'');
async function checkUpdates(silent){
 if(!repoOK()){UP={st:'error',rel:null,err:'Repositório não configurado (só funciona no APK gerado pelo GitHub).'};if(!silent)render();return}
 UP={...UP,st:'checking',err:''};if(!silent)render();
 try{
  const r=await fetch(`https://api.github.com/repos/${UPDATE_REPO}/releases/latest`,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});
  if(r.status===404)throw new Error('Ainda não há nenhuma versão publicada no GitHub.');
  if(r.status===403)throw new Error('O GitHub limitou os pedidos. Tenta daqui a uns minutos.');
  if(!r.ok)throw new Error('Erro do GitHub ('+r.status+').');
  const j=await r.json();
  const apk=(j.assets||[]).find(a=>/\.apk$/i.test(a.name));
  const rel={tag:j.tag_name,ver:verOf(j.tag_name),build:buildOf(j.tag_name),notes:j.body||'',date:(j.published_at||'').slice(0,10),url:apk?apk.browser_download_url:j.html_url,size:apk?apk.size:0,page:j.html_url};
  const newer=rel.build>APP_BUILD;
  UP={st:newer?'avail':'none',rel,err:''};
  S.prefs={...(S.prefs||{}),updLast:new Date().toISOString()};save();
  if(silent&&newer)notify({icon:'download',tone:'pri',title:`Nova versão ${rel.ver} disponível`,text:'Atualiza para teres as novidades e continuares a sincronizar com os outros aparelhos.',timeout:0,actions:[{label:'Atualizar',primary:true,fn:()=>go('updates')},{label:'Depois',fn:()=>{}}]});
 }catch(e){UP={st:'error',rel:null,err:e.message||'Sem ligação à internet.'}}
 render();
}
async function autoBackup(reason){
