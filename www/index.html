<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>GaragePro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* ===== Tokens (v0.6) — estilo × modo × cor de destaque. O JS define --pri/--pri-tx e os data-attributes ===== */
:root{
 --pri:#3b82f6;--pri-tx:#fff;
 --ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--vio:#a78bfa;--info:#60a5fa;
 --bg:#0b0d10;--sheet:#13161b;--card:#15181d;--card2:#1c2026;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
 --tx:#eceef2;--tx2:#c4c9d1;--mut:#8b929d;--faint:#5d646f;--ph1:#1d222a;--ph2:#2b323d;
 --r:14px;--rs:10px;--rb:12px;--sh:0 1px 2px rgba(0,0,0,.35);--sh2:0 10px 30px rgba(0,0,0,.35);
 --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--fh:var(--font);--hw:700;--htt:none;--hls:-.2px;--hst:normal;
 --soft:color-mix(in srgb,var(--pri) 14%,transparent);--pline:color-mix(in srgb,var(--pri) 45%,transparent);
 color-scheme:dark;
}
[data-mode=light]{--ok:#15803d;--warn:#b45309;--bad:#dc2626;--vio:#7c3aed;--info:#2563eb;
 --bg:#f3f4f6;--sheet:#fff;--card:#fff;--card2:#f3f4f6;--line:rgba(15,23,42,.08);--line2:rgba(15,23,42,.15);
 --tx:#111418;--tx2:#3b424c;--mut:#6b7280;--faint:#9ca3af;--ph1:#e5e7eb;--ph2:#cbd0d8;--sh:0 1px 2px rgba(15,23,42,.06);--sh2:0 10px 30px rgba(15,23,42,.12);color-scheme:light}
/* Oficina: grafite quente, cantos vivos, títulos condensados em maiúsculas */
[data-style=oficina]{--bg:#121212;--sheet:#1a1a1a;--card:#1b1b1b;--card2:#242424;--tx:#efefef;--tx2:#cfcfcf;--mut:#9b9b9b;--ph1:#232323;--ph2:#333;
 --r:6px;--rs:4px;--rb:6px;--fh:"Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;--hw:700;--htt:uppercase;--hls:.04em}
[data-style=oficina][data-mode=light]{--bg:#ebe9e4;--sheet:#fbfaf7;--card:#fbfaf7;--card2:#f0eee9;--tx:#16150f;--tx2:#3d3a33;--mut:#706b60;--ph1:#dedbd3;--ph2:#c7c2b6;--line:rgba(30,25,15,.1);--line2:rgba(30,25,15,.18)}
/* Desportivo: preto azulado, cantos médios, títulos em itálico pesado */
[data-style=desportivo]{--bg:#07080b;--sheet:#101218;--card:#101218;--card2:#171a22;--tx:#f2f3f5;--tx2:#c9ccd3;--mut:#8a8f9a;--ph1:#151821;--ph2:#252a36;
 --r:10px;--rs:8px;--rb:8px;--hw:800;--hst:italic;--hls:-.3px}
[data-style=desportivo][data-mode=light]{--bg:#f2f3f5;--sheet:#fff;--card:#fff;--card2:#eef0f3;--tx:#0d0f13;--tx2:#353a44;--mut:#6b7079;--ph1:#e3e5ea;--ph2:#c9cdd5}
html,body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px}
body{min-height:100dvh;transition:background .25s}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100dvh;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
input,select,textarea{font:inherit;color:var(--tx)}
select option,select optgroup{background:var(--sheet);color:var(--tx)}
.i{width:22px;height:22px;flex:none}
.i.s{width:16px;height:16px}
.mt{margin-top:12px}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
/* header */
.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid transparent}
.hdr h1{flex:1;text-align:center;font-size:17px;font-weight:var(--hw);font-family:var(--fh);text-transform:var(--htt);letter-spacing:var(--hls);font-style:var(--hst);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .hl,.hdr .hr{display:flex;gap:6px;min-width:44px}
.hdr .hr{justify-content:flex-end}
.hdr.root h1{text-align:left;font-size:24px;padding-left:4px}
.hdr.root .hl{display:none}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:var(--rb);color:var(--tx);position:relative;flex:none;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.ib .i{width:20px;height:20px}
.ib.pri{background:var(--pri);border-color:transparent;color:var(--pri-tx)}
.ib.plain{background:none;border:0;box-shadow:none}
.logo{flex:1;display:flex;align-items:center;gap:10px;font-size:20px;font-weight:var(--hw);font-family:var(--fh);text-transform:var(--htt);letter-spacing:var(--hls);font-style:var(--hst)}
.logo .lt span{color:var(--pri)}
.badge{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:10px;font-style:normal;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;font-weight:700;border:2px solid var(--bg)}
.badge.dotb{min-width:10px;height:10px;padding:0;top:-3px;right:-3px}
.hello{padding:6px 18px 2px}
.hello h2{font-size:24px;font-weight:var(--hw);font-family:var(--fh);text-transform:var(--htt);letter-spacing:var(--hls);font-style:var(--hst)}
.hello p{color:var(--mut);font-size:14px;margin-top:2px}
.hello p::first-letter{text-transform:uppercase}
.wrap{padding:0 16px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:22px 16px 10px}
.sec h2{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
[data-style=oficina] .sec h2::before{content:"";width:10px;height:10px;background:var(--pri)}
[data-style=desportivo] .sec h2{font-style:italic}
[data-style=desportivo] .sec h2::before{content:"";width:14px;height:4px;background:var(--pri);transform:skewX(-25deg)}
.sec a{color:var(--pri);font-size:14px;display:flex;align-items:center;gap:3px;cursor:pointer;white-space:nowrap;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
/* cores semânticas — tons suaves a partir do token */
.bub{width:40px;height:40px;border-radius:var(--rs);display:grid;place-items:center;flex:none}
.bub .i{width:20px;height:20px}
.b-ok{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.b-warn{background:color-mix(in srgb,var(--warn) 13%,transparent);color:var(--warn)}
.b-bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.b-pri{background:var(--soft);color:var(--pri)}
.b-vio{background:color-mix(in srgb,var(--vio) 13%,transparent);color:var(--vio)}
.b-mut{background:color-mix(in srgb,var(--mut) 13%,transparent);color:var(--mut)}
.b-info{background:color-mix(in srgb,var(--info) 13%,transparent);color:var(--info)}.c-info{color:var(--info)}.t-info{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}.fincard.st-info{color:var(--info)}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}.c-pri{color:var(--pri)}.c-vio{color:var(--vio)}.c-mut{color:var(--mut)}
/* números do topo */
.mstrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:14px 16px 0}
.ms{padding:12px;cursor:pointer;position:relative;overflow:hidden}
.ms .bub{width:30px;height:30px}
.ms .bub .i{width:16px;height:16px}
.ms b{display:block;font-size:16px;font-weight:750;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx);font-variant-numeric:tabular-nums}
.ms small{display:block;color:var(--mut);font-size:12px;margin-top:1px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:0 16px}
.grid2.np{padding:0}
.tile{display:flex;align-items:center;gap:12px;padding:14px 12px;min-width:0}
.tile>div{min-width:0}
.tile b{display:block;font-size:16px;font-weight:700;line-height:1.2;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.tile small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
/* cartão do veículo */
.vcard{margin:0 16px 14px;overflow:hidden;cursor:pointer}
.photo{position:relative;height:176px;background:var(--ph1);overflow:hidden}
.photo img,.photo .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.72));pointer-events:none}
.hero{height:220px}
.vinfo{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:flex-end;gap:10px;padding:12px 14px;color:#fff}
.vinfo .nm{min-width:0}
.vinfo b{display:block;font-size:20px;font-weight:var(--hw);font-family:var(--fh);text-transform:var(--htt);letter-spacing:var(--hls);font-style:var(--hst);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vinfo small{color:rgba(255,255,255,.78);font-size:13px}
.mono{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;background:rgba(0,0,0,.35)}
.vkm{margin-left:auto;font-weight:700;font-size:13.5px;white-space:nowrap;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);padding:5px 10px;border-radius:var(--rs);font-variant-numeric:tabular-nums}
.edit{margin-left:auto;background:var(--pri);color:var(--pri-tx);border-radius:var(--rs);padding:8px 16px;font-size:14px;font-weight:650}
.plate{display:inline-flex;align-items:stretch;height:26px;border-radius:5px;background:linear-gradient(180deg,#fff,#e6ebf2);border:1.5px solid #151515;box-shadow:0 2px 8px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.9);overflow:hidden;color:#111;font-family:"DIN Alternate","DIN Condensed","Arial Narrow","Roboto Condensed",Arial,sans-serif;font-weight:800;flex:none;vertical-align:middle}
.plate .eu{width:15px;background:linear-gradient(180deg,#0a3fb0,#002a86);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 0 2px;font-size:8.5px;line-height:1;font-family:Arial,sans-serif}
.plate .eu svg{width:10px;height:10px}
.plate .n{display:flex;align-items:center;padding:0 7px 0 6px;font-size:14.5px;letter-spacing:1px;white-space:nowrap}
.plate b{font-size:inherit!important;font-weight:800!important;color:inherit;display:block}
.plate .yr{width:14px;background:linear-gradient(180deg,#ffd733,#f0b800);border-left:1px solid rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:9.5px;line-height:1;font-family:"Arial Narrow","Roboto Condensed",Arial,sans-serif;color:#111;letter-spacing:-.2px;font-variant-numeric:tabular-nums}
.plate.abs{position:absolute;top:12px;left:12px;z-index:3}
.plate.sm{height:22px;border-width:1px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.plate.sm .eu{width:10px;font-size:7.5px;padding:0;justify-content:center}.plate.sm .eu svg{display:none}
.plate.sm .n{font-size:10.5px;padding:0 5px 0 4px;letter-spacing:.6px}
.plate.sm .yr{width:12px;font-size:8.5px;gap:0;letter-spacing:-.3px}
.pl-row{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}
.own{position:absolute;top:12px;right:12px;z-index:3;font-size:12px;font-weight:600;padding:4px 10px;border-radius:var(--rs);background:rgba(0,0,0,.5);color:#fff;border:1px solid rgba(255,255,255,.18)}
.chips{display:flex;gap:8px;padding:10px}
.chip{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:10px 10px 12px;border-radius:var(--rs);position:relative;overflow:hidden;border:1px solid var(--line);background:var(--card2)}
.chip .ci{flex:none;display:grid}
.chip small{display:block;font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{display:block;font-size:12.5px;font-weight:650;white-space:nowrap}
.chip>div{min-width:0}
.chip .pb{position:absolute;left:10px;right:10px;bottom:5px;height:3px;border-radius:2px;background:var(--line2);overflow:hidden}
.chip .pb i{display:block;height:100%}
.chip.none{color:var(--mut);font-size:13px}
.s-ok .ci,.s-ok b{color:var(--ok)}.s-ok .pb i{background:var(--ok)}
.s-warn{border-color:color-mix(in srgb,var(--warn) 40%,transparent)}.s-warn .ci,.s-warn b{color:var(--warn)}.s-warn .pb i{background:var(--warn)}
.s-bad{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 7%,var(--card2))}.s-bad .ci,.s-bad b{color:var(--bad)}.s-bad .pb i{background:var(--bad)}
.chip-go{width:34px;flex:none;border-radius:var(--rs);background:var(--card2);display:grid;place-items:center;border:1px solid var(--line);color:var(--mut)}
.add-veh{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 16px;width:calc(100% - 32px);height:54px;border:1.5px dashed var(--line2);border-radius:var(--r);color:var(--tx2);font-size:15px;font-weight:600}
.add-veh .i{color:var(--pri)}
/* separadores, filtros, segmentos */
.tabs{display:flex;gap:6px;padding:12px 16px 4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar,.fchips::-webkit-scrollbar{display:none}
.tabs button{padding:9px 14px;border-radius:var(--rs);font-size:14px;color:var(--tx2);white-space:nowrap;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:6px}
.tabs button .i{width:16px;height:16px}
.tabs.eq button{flex:1;flex-direction:column;gap:4px;padding:8px 2px;font-size:12px;min-width:0}
.tabs.eq button .i{width:19px;height:19px}
.tabs .on{background:var(--pri);border-color:transparent;color:var(--pri-tx)}
.fchips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none}
.fchips button{padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);white-space:nowrap;font-size:13.5px;color:var(--tx2)}
[data-style=oficina] .fchips button{border-radius:var(--rs)}
.fchips .on{background:var(--soft);border-color:var(--pline);color:var(--pri);font-weight:600}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:var(--rb);padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:calc(var(--rb) - 3px);font-size:14px;color:var(--tx2);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button .i{width:17px;height:17px}
.seg .on{background:var(--card);color:var(--tx);font-weight:650;box-shadow:0 1px 3px rgba(0,0,0,.18);border:1px solid var(--line2)}
.seg .on.bad{background:var(--bad);color:#fff;border-color:transparent}
.seg .on.t-ok{background:var(--ok);color:#fff;border-color:transparent}.seg .on.t-warn{background:var(--warn);color:#fff;border-color:transparent}.seg .on.t-vio{background:var(--vio);color:#fff;border-color:transparent}
/* linhas */
.list{padding:0 16px}
.row{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.row .mid{flex:1;min-width:0}
.row b{font-weight:650;font-size:15px}
.row small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.row .rt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.row .rt span{font-size:13.5px;font-weight:650;white-space:nowrap}
.row>.i{color:var(--faint)}
.amt{text-align:right;flex:none}
.amt b{display:block;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.amt small{display:block;color:var(--mut);font-size:12px;margin-top:3px}
.ico{--c:var(--mut);width:42px;height:42px;border-radius:var(--rs);display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
[data-mode=light] .ico{background:color-mix(in srgb,var(--c) 12%,transparent);color:color-mix(in srgb,var(--c) 80%,#000)}
.ico .i{width:21px;height:21px}
.ico.lg{width:48px;height:48px}.ico.lg .i{width:24px;height:24px}
.ico.sm{width:34px;height:34px}.ico.sm .i{width:18px;height:18px}
.pbar{height:4px;border-radius:2px;background:var(--line2);margin-top:9px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:2px}
.thumb{width:78px;height:56px;border-radius:var(--rs);overflow:hidden;position:relative;flex:none;background:var(--ph1)}
.thumb img,.thumb .ph{width:100%;height:100%;object-fit:cover;display:block}
.av{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:750;color:var(--pri);flex:none;font-size:16px}
.av.lg{width:56px;height:56px;font-size:21px}
.tag{display:inline-block;font-size:11.5px;font-weight:650;padding:3px 8px;border-radius:6px;white-space:nowrap}
.t-bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.t-warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.t-ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.t-pri{background:var(--soft);color:var(--pri)}
.t-mut{background:color-mix(in srgb,var(--mut) 13%,transparent);color:var(--mut)}
.mhead{padding:16px 20px 8px;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:650}
/* linha temporal */
.tl{position:relative;padding:0 16px 0 34px}
.tl::before{content:"";position:absolute;left:20px;top:8px;bottom:8px;width:2px;background:var(--line2)}
.tli{position:relative;display:flex;gap:12px;padding:12px;margin-bottom:10px;cursor:pointer}
.tli .dot{position:absolute;left:-18px;top:24px;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 3px var(--bg)}
.tli .mid{flex:1;min-width:0}
.tli .r1{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.tli .km1{color:var(--tx2);font-weight:650}
.tli .t{font-weight:650;margin:4px 0 3px;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tli .s{font-size:12.5px;color:var(--mut)}
/* finanças */
.fincard{margin:12px 16px 0;padding:4px 16px 6px;position:relative;overflow:hidden;border-top:3px solid currentColor}
.fincard.st-warn{color:var(--warn)}.fincard.st-pri{color:var(--pri)}.fincard.st-ok{color:var(--ok)}.fincard.st-mut{color:var(--line2)}
.fin-big{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line)}
.fin-big small{display:block;color:var(--mut);font-size:13px}
.fin-big b{display:block;font-size:28px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.fincard.st-mut .fin-big b{color:var(--tx)}
.fincard .kv{color:var(--tx)}
.acts{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:var(--r);font-size:13px;font-weight:650;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh);color:var(--tx)}
.act .i{width:22px;height:22px}
.a-ok .i{color:var(--ok)}.a-warn .i{color:var(--warn)}.a-vio .i{color:var(--vio)}
/* formulários */
.fl{display:block;font-size:13px;color:var(--tx2);margin:16px 0 7px;font-weight:600}
.in{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line2);border-radius:var(--rb);padding:0 12px;height:48px;position:relative}
.in>.i{color:var(--mut);width:19px;height:19px}

.lygrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

.xbtn>b{font-size:18px;font-weight:var(--hw);font-family:var(--fh);text-transform:var(--htt);letter-spacing:var(--hls);font-style:var(--hst)}

/* ================== UTILS ================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const arr=a=>Array.isArray(a)?a:[];
const grp=s=>s.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const fmtN=n=>n==null||isNaN(n)?'':(n<0?'-':'')+grp(String(Math.round(Math.abs(n))));
const fmtE=n=>{n=+n||0;const f=Math.abs(n).toFixed(2).split('.');return (n<-0.004?'-':'')+grp(f[0])+','+f[1]+' €'};
const fmtQ=n=>{n=+n||0;if(Number.isInteger(n))return grp(String(n));return n.toFixed(3).replace(/0+$/,'').replace('.',',')};
const decIn=n=>n?String(+n).replace('.',','):'';
const pInt=s=>{const d=String(s??'').replace(/\D/g,'');return d?parseInt(d,10):null};
const pDec=s=>{s=String(s??'').replace(/[\s€]/g,'');if(!s)return null;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');const n=parseFloat(s);return isNaN(n)?null:n};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayISO=()=>iso(new Date());
const pd=s=>new Date(s+'T00:00:00');
const fmtD=s=>{if(!s)return'';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`};
const fmtMonth=s=>pd(s.slice(0,7)+'-01').toLocaleDateString('pt-PT',{month:'long',year:'numeric'});
const addM=(d,m)=>{const x=new Date(d);x.setMonth(x.getMonth()+m);return x};
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const fmtDur=d=>{d=Math.max(0,Math.round(d));if(d<60)return d+(d===1?' dia':' dias');const m=Math.round(d/30.44);if(m<24)return m+' meses';const y=Math.floor(m/12),r=m%12;return y+' anos'+(r?' e '+r+(r===1?' mês':' meses'):'')};
const veh=id=>id?S.vehicles.find(v=>v.id===id):null;
const cli=id=>id?S.clients.find(c=>c.id===id):null;
const isCV=v=>!!(v&&cli(v.owner));
const vName=v=>v?`${v.marca} ${v.modelo}`.trim():'';
const vSub=v=>[v.ano,v.motor,v.cv?v.cv+' CV':''].filter(Boolean).join(' • ');
const mono=v=>esc((v.marca||'?').trim().charAt(0).toUpperCase());
const ini=s=>esc((s||'?').trim().charAt(0).toUpperCase());
const byName=(a,b)=>a.nome.localeCompare(b.nome,'pt');
const sortRecs=(a,b)=>b.data.localeCompare(a.data)||(b.km||0)-(a.km||0);
const sortMoves=(a,b)=>b.data.localeCompare(a.data)||String(b.id).localeCompare(String(a.id));

const CHV=`<span class="chv">${I('chevd','s')}</span>`;
const CAR_PH=`<svg class="ph" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice"><rect width="400" height="200" fill="var(--ph1)"/><g transform="translate(55,52)" stroke="var(--ph2)" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"><path d="M10 80 L14 58 Q18 48 32 46 L70 42 Q92 20 120 16 L200 14 Q222 14 236 28 L258 46 Q276 50 280 62 L282 80 Z"/><path d="M80 42 L102 23 L150 20 L150 42 Z M160 20 L200 19 Q214 20 224 30 L236 42 L160 42 Z"/><circle cx="64" cy="82" r="20" fill="var(--ph1)"/><circle cx="64" cy="82" r="7"/><circle cx="226" cy="82" r="20" fill="var(--ph1)"/><circle cx="226" cy="82" r="7"/></g></svg>`;
const photo=v=>v&&typeof v.foto==='string'&&/^data:image\//.test(v.foto)?`<img src="${esc(v.foto)}" alt="">`:CAR_PH;
const STARS=`<svg viewBox="0 0 10 10">${Array.from({length:12},(_,i)=>{const a=i*Math.PI/6;return `<circle cx="${(5+3.7*Math.cos(a)).toFixed(2)}" cy="${(5+3.7*Math.sin(a)).toFixed(2)}" r=".7" fill="#ffcc00"/>`}).join('')}</svg>`;
// Faixa amarela: gerada a partir da data de matrícula (AAAA-MM) introduzida pelo utilizador.
const PLATE_ORDER=['mes','ano']; // ordem de cima para baixo — trocar para ['ano','mes'] se preferires
const parseMat=s=>{s=String(s||'').trim();let m=s.match(/^(\d{4})-(\d{1,2})$/);if(m)return{y:+m[1],m:+m[2]};m=s.match(/^(\d{1,2})\s*[\/\-. ]\s*(\d{2}|\d{4})$/);if(m){let y=+m[2];if(y<100)y+=y>(new Date().getFullYear()%100)?1900:2000;return{y,m:+m[1]}}return null};
const normMat=s=>{const p=parseMat(s);return p&&p.m>=1&&p.m<=12&&p.y>=1900&&p.y<=2100?`${p.y}-${String(p.m).padStart(2,'0')}`:''};
const fmtMat=s=>{const p=parseMat(s);return p?String(p.m).padStart(2,'0')+'/'+p.y:''};
const plate=(v,cls='abs')=>{if(!v||!v.matricula)return'';const p=parseMat(v.dataMat);let yr='';if(p){const part={mes:String(p.m).padStart(2,'0'),ano:String(p.y%100).padStart(2,'0')};yr=`<span class="yr" title="Matrícula ${fmtMat(v.dataMat)}">${PLATE_ORDER.map(k=>`<b>${part[k]}</b>`).join('')}</span>`}return `<span class="plate ${cls}"><span class="eu">${STARS}<b>P</b></span><span class="n">${esc(v.matricula)}</span>${yr}</span>`};
const fmtPlate=s=>{const r=String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');return r.length===6?r.match(/../g).join('-'):String(s||'').trim().toUpperCase()};

let S={vehicles:[],records:[],clients:[],moves:[],tasks:[],intervals:{},prefs:{bg:'tema',bgInt:'media'},ver:3};
let UI={tkF:'porfazer',cur:null,vtab:'resumo',tlType:'all',tlVeh:'all',ftab:'cli',fType:'all'};
let F=null,VF=null,MV=null,DBOK=true;
const DB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('garagepro',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
 get(k){return new Promise((res,rej)=>{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
 set(k,v){return new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
};
// Converte dados de versões anteriores (dinheiro dentro das reparações) para o formato atual (Finanças separadas)
function normalize(o){return sanitize(migrate(o))}
function migrate(o){
 o=o&&typeof o==='object'?o:{};
 const s={vehicles:arr(o.vehicles),records:arr(o.records).filter(r=>r.kind!=='despesa'),clients:arr(o.clients),moves:arr(o.moves),tasks:arr(o.tasks),intervals:o.intervals||{},prefs:{bg:'tema',bgInt:'media',...(o.prefs||{})},ver:o.ver||1};
 s.vehicles.forEach(v=>{if(v.owner===undefined)v.owner=''});
 if(s.ver>=3)return s;
 const keep=[];
 s.records.forEach(r=>{
  const pecas=arr(r.pecas);
  const pt=pecas.reduce((a,p)=>a+(+p.preco||0),0);
  const mao=+r.mao||0;
  const outros=r.v2?(+r.outros||0):Math.max(0,(+r.custo||0)-pt-mao);
  const base={vid:r.vid||'',cid:r.vid?'':(r.cid||'')};
  const t=recTitle(r);
  if(pt>0)s.moves.push({id:uid(),tipo:'comprei',valor:pt,pago:true,data:r.data,desc:'Peças — '+t,...base});
  if(outros>0)s.moves.push({id:uid(),tipo:'comprei',valor:outros,pago:true,data:r.data,desc:'Outros custos — '+t,...base});
  if(mao>0)s.moves.push({id:uid(),tipo:'cobrar',valor:mao,data:r.data,desc:'Mão de obra — '+t,...base});
  arr(r.adiant).forEach(a=>s.moves.push({id:uid(),tipo:'recebi',valor:+a.valor||0,data:a.data||r.data,desc:a.nota||'Adiantamento',...base}));
  if(r.pendente||(!r.km&&!pecas.length&&r.tipo==='outro'))return; // era só um adiantamento / trabalho ainda não feito
  keep.push({id:r.id,vid:r.vid||'',kind:r.kind==='peca'?'peca':'manutencao',tipo:r.tipo,titulo:r.titulo||'',motivo:r.motivo||'preventiva',data:r.data,km:r.km||null,pecas:pecas.map(p=>({key:p.key||'',nome:p.nome,qtd:+p.qtd||1,un:p.un||'un'})),notas:r.notas||''});
 });
 s.records=keep;s.ver=3;
 return s;
}
function save(){
 if(DBOK){DB.set('state',S).catch(()=>toast('Erro ao guardar os dados!'));}
 else{try{localStorage.setItem('garagepro',JSON.stringify(S))}catch(e){toast('Erro ao guardar os dados!')}}
}

/* ================== FINANÇAS ================== */
const MT={
 recebi:{n:'Recebi',ic:'in',c:'ok',def:'Pagamento / adiantamento',sg:'+ ',ex:'Dinheiro que o cliente te deu — adiantamento ou pagamento.',ph:'Ex: adiantamento para peças'},
 comprei:{n:'Comprei',ic:'cart',c:'warn',def:'Compra de peças',sg:'− ',ex:'Peças ou material que compraste. Num carro de cliente, entra na conta dele.',ph:'Ex: kit embraiagem + rolamento'},
 cobrar:{n:'A cobrar',ic:'receipt',c:'vio',def:'Mão de obra',sg:'',ex:'Valor a cobrar ao cliente que não é peça (mão de obra, serviços…).',ph:'Ex: mão de obra da embraiagem'}
};
const mvCli=m=>{if(m.cid)return cli(m.cid);const v=veh(m.vid);return v?cli(v.owner):null};
function bal(ms){let comp=0,cob=0,rec=0,pp=0;ms.forEach(m=>{const x=+m.valor||0;if(m.tipo==='comprei'){comp+=x;if(!m.pago)pp+=x}else if(m.tipo==='cobrar')cob+=x;else rec+=x});return{comp,cob,rec,pp,tot:comp+cob,s:comp+cob-rec}}
const vMoves=vid=>{const v=veh(vid),o=(v&&v.owner)||'';return S.moves.filter(m=>m.vid===vid&&(m.cid||'')===o)};
const cMoves=cid=>S.moves.filter(m=>{const c=mvCli(m);return c&&c.id===cid});
const cBal=cid=>bal(cMoves(cid));
function globalFin(){
 let rec=0,adi=0;
 S.clients.forEach(c=>{const b=cBal(c.id);if(b.s>0.004)rec+=b.s;else if(b.s<-0.004)adi-=b.s});
 const pp=S.moves.filter(m=>m.tipo==='comprei'&&!m.pago).reduce((a,m)=>a+(+m.valor||0),0);
 const mk=todayISO().slice(0,7);
 const rm=S.moves.filter(m=>m.tipo==='recebi'&&m.data.startsWith(mk)).reduce((a,m)=>a+(+m.valor||0),0);
 return{rec,adi,pp,rm};
}
function stTag(b){
 if(b.s>0.004)return `<span class="tag t-warn">Falta ${fmtE(b.s)}</span>`;
 if(b.s<-0.004)return `<span class="tag t-info">Adiantado ${fmtE(-b.s)}</span>`;
 if(b.tot||b.rec)return `<span class="tag t-ok">Pago</span>`;
 return `<span class="tag t-mut">Sem valores</span>`;
}
function finCard(b,client){
 if(!client)return `<div class="card fincard st-${b.pp?'warn':'mut'}"><div class="fin-big"><span class="bub b-warn">${I('cart')}</span><div><small>Gasto neste carro</small><b style="color:var(--tx)">${fmtE(b.comp)}</b></div></div>${b.pp?`<div class="kv"><span>Por pagar à loja</span><b class="c-bad">${fmtE(b.pp)}</b></div>`:'<div class="kv"><span>Compras</span><b>tudo pago à loja</b></div>'}</div>`;
 const s=b.s,st=s>0.004?['warn','Falta receber',fmtE(s),'alert']:s<-0.004?['info','Adiantado por gastar',fmtE(-s),'wallet']:(b.tot||b.rec)?['ok','Tudo pago','0,00 €','check']:['mut','Sem valores','0,00 €','wallet'];
 return `<div class="card fincard st-${st[0]}"><div class="fin-big"><span class="bub b-${st[0]}">${I(st[3])}</span><div><small>${st[1]}</small><b>${st[2]}</b></div></div>
  <div class="kv"><span>Peças compradas</span><b>${fmtE(b.comp)}</b></div>
  <div class="kv"><span>Mão de obra / a cobrar</span><b>${fmtE(b.cob)}</b></div>
  <div class="kv"><span>Total</span><b>${fmtE(b.tot)}</b></div>
  <div class="kv"><span>Já recebido</span><b class="c-ok">${fmtE(b.rec)}</b></div>
  ${b.pp?`<div class="kv"><span>Compras por pagar à loja</span><b class="c-bad">${fmtE(b.pp)}</b></div>`:''}</div>`;
}
const acts=(t,client)=>`<div class="acts">${client?`<button class="act a-ok" onclick="moveSheet(null,'recebi','${t}')">${I('in')}<span>Recebi</span></button>`:''}<button class="act a-warn" onclick="moveSheet(null,'comprei','${t}')">${I('cart')}<span>Comprei</span></button>${client?`<button class="act a-vio" onclick="moveSheet(null,'cobrar','${t}')">${I('receipt')}<span>A cobrar</span></button>`:''}</div>`;
function moveRow(m,showT=true){
 const t=MT[m.tipo]||MT.recebi,v=veh(m.vid),c=mvCli(m);
 const who=[v?vName(v):'',c?c.nome:(v?'':'Geral')].filter(Boolean).join(' · ');
 return `<div class="row card" onclick="moveSheet('${m.id}')"><span class="bub b-${t.c}">${I(t.ic)}</span><div class="mid"><b>${esc(m.desc||t.def)}</b><small>${fmtD(m.data)}${showT&&who?' · '+esc(who):''}</small></div><div class="amt"><b class="c-${t.c}">${t.sg}${fmtE(m.valor)}</b>${m.tipo==='comprei'&&!m.pago?'<small><span class="tag t-bad">Por pagar</span></small>':`<small>${t.n}</small>`}</div></div>`;
}
function movesByMonth(ms,showT){
 let h='',cur='';
 ms.forEach(m=>{const k=m.data.slice(0,7);if(k!==cur){cur=k;h+=`<div class="mhead">${fmtMonth(m.data)}</div>`}h+=`<div class="list">${moveRow(m,showT)}</div>`});
 return h;
}

/* ================== MANUTENÇÃO ================== */
const getInt=k=>S.intervals[k]||{km:CAT[k].km,m:CAT[k].m};
const ivText=iv=>{const a=[];if(iv.km)a.push(fmtN(iv.km)+' km');if(iv.m)a.push(iv.m+(iv.m===1?' mês':' meses'));return a.length?a.join(' ou '):'Sem intervalo'};
function replaced(r){const s=new Set();if(CAT[r.tipo])s.add(r.tipo);arr(r.pecas).forEach(p=>{if(CAT[p.key])s.add(p.key)});return[...s]}
function hist(vid,key){return S.records.filter(r=>r.vid===vid&&r.km&&replaced(r).includes(key)).sort((a,b)=>(b.km-a.km)||b.data.localeCompare(a.data))}
function due(v,key){
 const h=hist(v.id,key);if(!h.length)return null;
 const last=h[0],iv=getInt(key),d={v,key,last,hist:h,none:false};
 if(!iv.km&&!iv.m){d.none=true;return d}
 let rk=0,rt=0,rKm=0,rDays=0;
 if(iv.km){rKm=last.km+iv.km-v.km;rk=(v.km-last.km)/iv.km}
 if(iv.m){const a=pd(last.data),b=addM(a,iv.m),t=today0();rDays=Math.round((b-t)/864e5);rt=(t-a)/(b-a)}
 const byT=iv.m&&(!iv.km||rt>rk);

function readPhoto(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const max=1280,k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

function saveVeh(){
 if(lock('saveVeh'))return;
 if(!VF.marca.trim()||!VF.modelo.trim())return toast('Indica a marca e o modelo');
 let owner=VF.owner;
 if(owner==='__new'){
  if(!VF.ncNome.trim())return toast('Indica o nome do cliente');
  const c={id:uid(),nome:VF.ncNome.trim(),tel:VF.ncTel.trim(),notas:''};S.clients.push(c);owner=c.id;
 }
 const v={id:VF.id||uid(),owner,marca:VF.marca.trim(),modelo:VF.modelo.trim(),ano:pInt(VF.ano)||'',motor:VF.motor.trim(),cv:pInt(VF.cv)||'',comb:VF.comb,caixa:VF.caixa,carro:VF.carro,matricula:fmtPlate(VF.matricula),dataMat:normMat(VF.dataMat),km:pInt(VF.km)||0,foto:VF.foto||''};
 const i=S.vehicles.findIndex(x=>x.id===v.id),oldKm=i>=0?S.vehicles[i].km:v.km;
 if(i>=0)S.vehicles[i]=v;else S.vehicles.push(v);
 UI.cur=v.id;save();toast('Veículo guardado');back();afterKm(v.id,oldKm,450);
}
function delVeh(id){
 const v=veh(id),nm=vMoves(id).length;
 if(!confirm(`Apagar ${vName(v)} e todas as suas reparações${nm?` e ${nm} movimento(s) de finanças`:''}?`))return;
 const own=v.owner||'';S.vehicles=S.vehicles.filter(x=>x.id!==id);S.records=S.records.filter(r=>r.vid!==id);S.moves=S.moves.filter(m=>!(m.vid===id&&(m.cid||'')===own));S.moves.forEach(m=>{if(m.vid===id)m.vid=''});S.tasks=S.tasks.filter(t=>t.vid!==id);
 if(UI.tlVeh===id)UI.tlVeh='all';
 UI.cur=myVeh()[0]?.id||S.vehicles[0]?.id||null;save();tab('home');toast('Veículo apagado');
}

/* ================== REPARAÇÃO (só técnica) ================== */
function vehOptions(sel){
 const mine=myVeh(),cs=[...S.clients].sort(byName);
 let h=mine.length?`<optgroup label="Os meus">${mine.map(v=>`<option value="${v.id}" ${sel===v.id?'selected':''}>${esc(vName(v))}</option>`).join('')}</optgroup>`:'';
 cs.forEach(c=>{const vs=S.vehicles.filter(v=>v.owner===c.id);if(vs.length)h+=`<optgroup label="${esc(c.nome)}">${vs.map(v=>`<option value="${v.id}" ${sel===v.id?'selected':''}>${esc(vName(v))} — ${esc(c.nome)}</option>`).join('')}</optgroup>`});
 return h;
}
function newRep(vid,key,motivo='preventiva'){
 closeSheet();
 if(!S.vehicles.length){toast('Adiciona primeiro um veículo');return openVForm()}
 const v=veh(vid)||veh(UI.cur)||S.vehicles[0];
 F={id:null,kind:'manutencao',vid:v.id,tipo:key||'oleo',titulo:'',motivo,data:todayISO(),km:fmtN(v.km),pecas:[],notas:''};
 go('rep');
}
function editRecord(id){
 const r=S.records.find(x=>x.id===id);if(!r)return;
 F={...r,pecas:arr(r.pecas).map(p=>({...p})),km:r.km?fmtN(r.km):'',titulo:r.titulo||'',notas:r.notas||''};
 go('rep');
}
function partOptions(sel,withOther){
 return GROUPS.map(g=>`<optgroup label="${g}">${Object.keys(CAT).filter(k=>CAT[k].g===g).map(k=>`<option value="${k}" ${sel===k?'selected':''}>${CAT[k].n}</option>`).join('')}</optgroup>`).join('')+(withOther?`<option value="${withOther}" ${sel===withOther?'selected':''}>Outra…</option>`:'');
}
function vRep(){
 const e=!!F.id;
 let h=hdr(e?'Editar reparação':'Nova reparação',e?`<button class="ib" style="color:var(--bad)" onclick="delRecord()">${I('trash')}</button>`:'');
 h+='<div class="wrap">';
 h+=`<label class="fl">Veículo</label><div class="in">${I('car')}<select onchange="F.vid=this.value;render()">${vehOptions(F.vid)}</select>${CHV}</div>`;
 const ti=CAT[F.tipo]?CAT[F.tipo].ic:'wrench';
 const opts=GROUPS.map(g=>`<optgroup label="${g}">${Object.keys(CAT).filter(x=>CAT[x].g===g).map(x=>`<option value="${x}" ${F.tipo===x?'selected':''}>${label(x)}</option>`).join('')}</optgroup>`).join('')+`<option value="outro" ${F.tipo==='outro'?'selected':''}>Outro…</option>`;
 h+=`<label class="fl">O que foi feito</label><div class="in">${I(ti)}<select onchange="F.tipo=this.value;render()">${opts}</select>${CHV}</div>`;
 if(F.tipo==='outro')h+=`<label class="fl">Descrição</label><div class="in"><input value="${esc(F.titulo)}" placeholder="Ex: Substituição da bomba de água" oninput="F.titulo=this.value"></div>`;
 h+=`<label class="fl">Motivo</label><div class="seg">${[['preventiva','Preventiva','check'],['avaria','Avaria','alert']].map(t=>`<button class="${F.motivo===t[0]?'on'+(t[0]==='avaria'?' bad':''):''}" onclick="F.motivo='${t[0]}';render()">${I(t[2])}${t[1]}</button>`).join('')}</div>`;
 if(F.motivo==='avaria')h+=`<p class="hint">A peça anterior fica marcada como avariada, com os km e o tempo que durou.</p>`;
 h+=`<div class="grid2 np"><div><label class="fl">Data</label><div class="in"><input type="date" value="${F.data}" onchange="F.data=this.value"></div></div><div><label class="fl">Quilómetros</label><div class="in"><input value="${esc(F.km)}" inputmode="numeric" placeholder="Ex: 373 594" oninput="F.km=this.value"></div></div></div>`;
 h+=`<div class="card box"><div class="box-h"><b>Peças montadas</b><a onclick="addPeca()">${I('plus','s')} Adicionar</a></div>`;
 h+=F.pecas.length?F.pecas.map((p,i)=>{const c=CAT[p.key];return `<div class="prow" onclick="addPeca(${i})"><span class="ico sm" style="--c:${c?c.c:'#64748b'}">${I(c?c.ic:'cog')}</span><div class="mid">${esc(p.nome)}<small>${fmtQ(p.qtd)} ${esc(p.un)}${c&&p.nome!==c.n?' · '+c.n:''}</small></div><button class="ib" onclick="event.stopPropagation();F.pecas.splice(${i},1);render()">${I('trash','s')}</button></div>`}).join(''):`<p class="hint" style="margin-top:2px">Opcional. Se não juntares peças, conta como trocada a peça escolhida em "O que foi feito".</p>`;
 h+='</div>';
 h+=`<div class="note">${I('euro')}<span>Aqui não há valores. O que compraste, recebeste ou tens a cobrar regista-se em <b>Finanças</b>.</span></div>`;
 h+=`<label class="fl">Notas (opcional)</label><textarea class="ta" placeholder="Ex: marca do óleo, sintomas da avaria, observações..." oninput="F.notas=this.value">${esc(F.notas)}</textarea>`;
 h+=`<button class="btn" onclick="saveRecord()">${I('check')} ${e?'Guardar alterações':'Guardar reparação'}</button>`;
 if(e)h+=`<button class="btn danger" onclick="delRecord()">Apagar reparação</button>`;
 h+='<div style="height:20px"></div></div>';
 return h;
}
function addPeca(idx){
 const ed=idx!=null?F.pecas[idx]:null;
 const used=F.pecas.map(p=>p.key);
 const def=ed?ed.key||'__':(CAT[F.tipo]&&!used.includes(F.tipo)?F.tipo:(F.tipo==='oleo'&&!used.includes('filtro_oleo')?'filtro_oleo':'__'));
 openSheet(`<h3>${ed?'Editar peça':'Peça montada'}</h3>
  <label class="fl">Peça</label><div class="in"><select id="ap-k">${partOptions(def,'__')}</select>${CHV}</div>
  <label class="fl">Descrição / marca</label><div class="in"><input id="ap-n" value="${ed?esc(ed.nome):''}" placeholder="Ex: Óleo motor 5W30"></div>
  <div class="grid2 np"><div><label class="fl">Quantidade</label><div class="in"><input id="ap-q" inputmode="decimal" value="${ed?decIn(ed.qtd):'1'}"></div></div>
  <div><label class="fl">Unidade</label><div class="in"><select id="ap-u">${UNITS.map(u=>`<option ${(ed?ed.un===u:def==='oleo'&&u==='L')?'selected':''}>${u}</option>`).join('')}</select>${CHV}</div></div></div>
  <button class="btn" onclick="savePeca(${idx==null?'null':idx})">${ed?'Guardar':'Adicionar'}</button>`);
}
function savePeca(idx){
 let key=$('#ap-k').value;if(key==='__')key='';
 const nome=$('#ap-n').value.trim()||(CAT[key]?CAT[key].n:'');
 if(!nome)return toast('Escreve a descrição da peça');
 const p={key,nome,qtd:pDec($('#ap-q').value)||1,un:$('#ap-u').value};
 if(idx!=null)F.pecas[idx]=p;else F.pecas.push(p);
 closeSheet();render();
}
function saveRecord(){
 if(lock('saveRecord'))return;
 const v=veh(F.vid);if(!v)return toast('Escolhe um veículo');
 const km=pInt(F.km);
 if(!F.data)return toast('Indica a data');
 if(!km)return toast('Indica os quilómetros');
 if(F.tipo==='outro'&&!F.titulo.trim())return toast('Descreve a reparação');
 const r={id:F.id||uid(),vid:v.id,kind:F.kind||'manutencao',tipo:F.tipo,titulo:F.tipo==='outro'?F.titulo.trim():'',motivo:F.motivo,data:F.data,km,pecas:F.pecas,notas:(F.notas||'').trim()};
 const i=S.records.findIndex(x=>x.id===r.id);
 if(i>=0)S.records[i]=r;else S.records.push(r);
 const oldKm=v.km;if(km>v.km)v.km=km;
 save();toast('Reparação guardada');back();afterKm(v.id,oldKm,450);
}
function delRecord(){
 if(!confirm('Apagar esta reparação?'))return;
 S.records=S.records.filter(r=>r.id!==F.id);save();toast('Apagada');back();
}

function tlList(rs,showVeh){
 return '<div class="tl">'+rs.map((r,i)=>{
  const ic=recIcon(r),v=veh(r.vid),c=v&&cli(v.owner);
  const sub=[recSub(r),showVeh&&v?vName(v)+(c?' ('+c.nome+')':''):''].filter(Boolean).join(' · ');
  return `<div class="tli card" onclick="editRecord('${r.id}')"><span class="dot" style="background:${ic.c};color:${ic.c}"></span><span class="ico" style="--c:${ic.c}">${I(ic.ic)}</span><div class="mid"><div class="r1"><span>${fmtD(r.data)}</span><span class="${i===0&&r.km?'km1':''}">${r.km?fmtN(r.km)+' km':''}</span></div><div class="t">${esc(recTitle(r))}${r.motivo==='avaria'?'<span class="tag t-bad">Avaria</span>':''}</div><div class="s">${esc(sub)}</div></div></div>`;
 }).join('')+'</div>';

 const tOk={all:()=>true,meus:r=>!isCV(veh(r.vid)),cli:r=>isCV(veh(r.vid)),av:r=>r.motivo==='avaria'}[UI.tlType]||(()=>true);

 h+=`<div class="fchips">${[['all','Todas'],['meus','Meus carros'],['cli','Clientes'],['av','Avarias']].map(t=>`<button class="${UI.tlType===t[0]?'on':''}" onclick="UI.tlType='${t[0]}';render()">${t[1]}</button>`).join('')}</div>`;
 if(UI.tlVeh!=='all')h+=`<div class="wrap" style="margin-bottom:10px"><span class="tag t-pri" style="font-size:13px;padding:6px 10px">${esc(vName(veh(UI.tlVeh)))} <a onclick="UI.tlVeh='all';render()" style="margin-left:6px;cursor:pointer">✕</a></span></div>`;

function tlFilter(){

 openSheet(`<h3>Filtrar por veículo</h3><div style="margin-top:6px">${o('all','Todos os veículos')}${S.vehicles.map(v=>o(v.id,esc(vName(v))+(cli(v.owner)?' — '+esc(cli(v.owner).nome):''))).join('')}</div>`);
}

/* ================== PEÇAS MONTADAS ================== */
function partsHTML(v){
 const ds=tracked(v).map(k=>due(v,k)).sort((a,b)=>(b.none?-1:b.ratio)-(a.none?-1:a.ratio));
 if(!ds.length)return emptyBox('cog','Ainda não há peças registadas neste veículo.');
 return ds.map(d=>{
  const c=CAT[d.key],uso=Math.max(0,v.km-d.last.km),avs=d.hist.filter(r=>r.motivo==='avaria').length;
  return `<div class="row card" onclick="partSheet('${v.id}','${d.key}')"><span class="ico lg" style="--c:${c.c}">${I(c.ic)}</span><div class="mid"><b>${c.n}</b> ${avs?`<span class="tag t-bad">${avs} avaria${avs>1?'s':''}</span>`:''}<small>Montada a ${fmtD(d.last.data)} · ${fmtN(d.last.km)} km</small><small>Em uso há ${fmtN(uso)} km · ${fmtDur((today0()-pd(d.last.data))/864e5)}${d.none?'':` · <span style="color:${COLS[d.st]}">${d.text.toLowerCase()}</span>`}</small></div>${I('chev')}</div>`;
 }).join('');
}
function partSheet(vid,key){
 const v=veh(vid),c=CAT[key],d=due(v,key);if(!d)return;
 const ms=montagens(vid,key),fechadas=ms.filter(m=>!m.ativa),avs=fechadas.filter(m=>m.fim==='avaria');
 const med=a=>a.length?a.reduce((s,m)=>s+m.km,0)/a.length:0;
 const cur=ms[0];
 openSheet(`<div class="sh-h"><span class="ico lg" style="--c:${c.c}">${I(c.ic)}</span><div><h3>${c.n}</h3><small>${esc(vName(v))} · ${c.g}</small></div></div>
  <div class="kv"><span>Montada</span><b>${fmtD(cur.r.data)} · ${fmtN(cur.r.km)} km</b></div>
  <div class="kv"><span>Em uso há</span><b>${fmtN(cur.km)} km · ${fmtDur(cur.dias)}</b></div>
  ${d.none?'':`<div class="kv"><span>Próxima troca</span><b style="color:${COLS[d.st]}">${d.text}</b></div>`}
  <div class="kv"><span>Intervalo</span><b>${ivText(getInt(key))}</b></div>
  ${fechadas.length?`<div class="kv"><span>Duração média</span><b>${fmtN(med(fechadas))} km</b></div>`:''}
  ${avs.length?`<div class="kv"><span>Até avariar (média de ${avs.length})</span><b class="c-bad">${fmtN(med(avs))} km</b></div>`:''}
  <h4>Histórico de montagens</h4>
  ${ms.map(m=>`<div class="hrow" onclick="editRecord('${m.r.id}')"><div><b>${fmtD(m.r.data)}</b><small>${esc(arr(m.r.pecas).find(p=>p.key===key)?.nome||recTitle(m.r))}</small><small>${fmtN(m.r.km)} km</small></div><div class="r">${m.ativa?'<span class="tag t-ok">Em uso</span>':m.fim==='avaria'?'<span class="tag t-bad">Avariou</span>':'<span class="tag t-pri">Trocada</span>'}<small>${m.ativa?'há ':'durou '}${fmtN(m.km)} km</small><small>${fmtDur(m.dias)}</small></div></div>`).join('')}
  <div class="grid2 np"><button class="btn sm" onclick="newRep('${vid}','${key}','preventiva')">${I('plus','s')} Troca</button><button class="btn sm" style="background:var(--bad);box-shadow:none" onclick="newRep('${vid}','${key}','avaria')">${I('alert','s')} Avaria</button></div>`);
}

function vFin(){
 const g=globalFin();
 let h=hdr('Finanças',`<button class="ib pri" onclick="plusFin()">${I('plus')}</button>`,true);
 h+=`<div class="grid2 mt">
  <div class="card tile"><span class="bub b-warn">${I('wallet')}</span><div><b>${fmtE(g.rec)}</b><small>A receber</small></div></div>
  <div class="card tile"><span class="bub b-info">${I('coins')}</span><div><b>${fmtE(g.adi)}</b><small>Adiantado por gastar</small></div></div>

  <div class="card tile"><span class="bub b-ok">${I('in')}</span><div><b>${fmtE(g.rm)}</b><small>Recebido este mês</small></div></div></div>`;
 h+=`<div class="wrap mt">${acts('',true)}</div>`;
 const tabs=[['cli','Clientes','users'],['mov','Movimentos','list'],['pp','Por pagar','cart']];

 if(UI.ftab==='cli'){
  const cs=[...S.clients].map(c=>({c,b:cBal(c.id)})).sort((a,b)=>b.b.s-a.b.s||byName(a.c,b.c));
  h+='<div class="list mt">'+cs.map(({c,b})=>{const nv=S.vehicles.filter(v=>v.owner===c.id).length;return `<div class="row card" onclick="openCli('${c.id}')"><span class="av">${ini(c.nome)}</span><div class="mid"><b>${esc(c.nome)}</b><small>${nv} carro${nv===1?'':'s'}${c.tel?' · '+esc(c.tel):''}</small></div>${stTag(b)}</div>`}).join('')+'</div>';
  if(!cs.length)h+=emptyBox('users','Sem clientes.',`<button class="btn ghost sm" onclick="cliSheet()">Adicionar cliente</button>`);
  else h+=`<div class="wrap"><button class="btn ghost sm" onclick="cliSheet()">${I('plus','s')} Novo cliente</button></div>`;
 }else if(UI.ftab==='mov'){
  const f=UI.fType;
  h+=`<div class="fchips" style="padding-top:10px">${[['all','Todos'],['recebi','Recebi'],['comprei','Comprei'],['cobrar','A cobrar']].map(t=>`<button class="${f===t[0]?'on':''}" onclick="UI.fType='${t[0]}';render()">${t[1]}</button>`).join('')}</div>`;
  const ms=S.moves.filter(m=>f==='all'||m.tipo===f).sort(sortMoves);
  h+=ms.length?movesByMonth(ms,true):emptyBox('list','Sem movimentos.');
 }else{

 }
 return h;

function moveSheet(id,tipo='recebi',t=''){
 if(id){const m=S.moves.find(x=>x.id===id);if(!m)return;MV={...m,valor:decIn(m.valor),t:m.vid?'v:'+m.vid:m.cid?'c:'+m.cid:'',nome:''}}

 setTimeout(()=>{const e=$('#mv-v');e&&!id&&e.focus()},260);

function mvTargets(){
 const tp=MV.tipo,o=(val,txt)=>`<option value="${val}" ${MV.t===val?'selected':''}>${esc(txt)}</option>`;

 else h+=`<option value="" ${!MV.t?'selected':''} disabled>Escolhe o cliente…</option>`;
 [...S.clients].sort(byName).forEach(c=>{const vs=S.vehicles.filter(v=>v.owner===c.id);h+=`<optgroup label="${esc(c.nome)}">${o('c:'+c.id,c.nome+(vs.length?' (geral)':''))}${vs.map(v=>o('v:'+v.id,c.nome+' — '+vName(v))).join('')}</optgroup>`});

let TK=null;
const taskVeh=t=>veh(t.vid);
function prazoInfo(t){
 if(!t.prazo||t.feito)return null;
 const d=Math.round((pd(t.prazo)-today0())/864e5);
 if(d<0)return{c:'t-bad',t:'Atrasada '+fmtDur(-d)};
 if(d===0)return{c:'t-warn',t:'Hoje'};
 if(d===1)return{c:'t-warn',t:'Amanhã'};
 return{c:'t-mut',t:'Até '+fmtD(t.prazo)};
}
function sortTasks(a,b){
 if(a.feito!==b.feito)return a.feito?1:-1;
 if(a.feito)return(b.feitoEm||'').localeCompare(a.feitoEm||'');
 const u=(b.prio==='urgente')-(a.prio==='urgente');if(u)return u;
 const pa=a.prazo||'9999',pb=b.prazo||'9999';if(pa!==pb)return pa.localeCompare(pb);
 return(a.criado||'').localeCompare(b.criado||'');
}
const pendTasks=vid=>S.tasks.filter(t=>!t.feito&&(vid===undefined||t.vid===vid));
function taskRow(t,showVeh=true){
 const v=taskVeh(t),c=v&&cli(v.owner),p=prazoInfo(t);
 const who=showVeh?(v?vName(v)+(c?' · '+c.nome:''):'Geral'):'';
 const meta=[who,t.feito&&t.feitoEm?'Feita a '+fmtD(t.feitoEm):''].filter(Boolean).join(' · ');
 return `<div class="row card task${t.feito?' done':''}${t.prio==='urgente'&&!t.feito?' urg':''}" onclick="taskSheet('${t.id}')"><button class="ck-b${t.feito?' on':''}" onclick="event.stopPropagation();toggleTask('${t.id}')">${I('check')}</button><div class="mid"><b>${esc(t.titulo)}</b>${meta?`<small>${esc(meta)}</small>`:''}${(t.prio==='urgente'&&!t.feito)||p?`<div class="tgs">${t.prio==='urgente'&&!t.feito?'<span class="tag t-bad">Urgente</span>':''}${p?`<span class="tag ${p.c}">${p.t}</span>`:''}</div>`:''}</div>${t.notas?`<span class="c-mut">${I('list','s')}</span>`:''}</div>`;
}

const b64e=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pinHash(pin,saltB64){
 const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
 return b64e(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64d(saltB64),iterations:150000,hash:'SHA-256'},k,256));
}
const pinOn=()=>!!(S.prefs&&S.prefs.pin&&S.prefs.pin.hash);
let LK={buf:'',busy:false},_hiddenAt=0;
function lockNow(){

}
function lkRender(msg){
 const d=$('#lock');if(!d)return;const p=S.prefs.pin,len=p.len||4,wait=lkWait();
 d.innerHTML=`<div class="lkbox"><img class="lgimg" src="${LOGO}" alt="GaragePro"><h2>GaragePro</h2><p class="hint" id="lkmsg">${msg||(wait?'Demasiadas tentativas. Espera '+wait+' s.':'Introduz o PIN')}</p>
  <div class="dots">${Array.from({length:len},(_,i)=>`<i class="${i<LK.buf.length?'on':''}"></i>`).join('')}</div>
  <div class="kp">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button aria-label="${k==='⌫'?'Apagar dígito':k}" onclick="lkKey('${k}')">${k}</button>`).join('')}</div>
  <button class="lkforgot" onclick="lkForgot()">Esqueci-me do PIN</button></div>`;
 if(wait)setTimeout(()=>{if($('#lock')&&!LK.buf)lkRender()},1000);
}
function lkWait(){const u=+((S.prefs||{}).pinUntil||0);return u>Date.now()?Math.ceil((u-Date.now())/1000):0}
async function lkKey(k){
 if(LK.busy||lkWait())return;
 const p=S.prefs.pin,len=p.len||4;
 if(k==='⌫'){LK.buf=LK.buf.slice(0,-1);return lkRender()}
 if(LK.buf.length>=len)return;
 LK.buf+=k;lkRender();
 if(LK.buf.length<len)return;
 LK.busy=true;const ok=(await pinHash(LK.buf,p.salt))===p.hash;LK.busy=false;
 if(ok){S.prefs={...S.prefs,pinFails:0,pinUntil:0};save();$('#lock')&&$('#lock').remove();return}
 const f=(+S.prefs.pinFails||0)+1,until=f>=5?Date.now()+Math.min(300,30*2**(f-5))*1000:0;
 S.prefs={...S.prefs,pinFails:f,pinUntil:until};save();LK.buf='';
 lkRender(until?`PIN errado. Espera ${Math.ceil((until-Date.now())/1000)} s.`:`PIN errado (${f} de 5 tentativas)`);
 const dots=$('#lock .dots');dots&&dots.classList.add('shake');
}

/* ================== CÓPIAS E PASSAGEM DE DADOS ================== */
// Formato .garagepro = JSON comprimido (gzip). A importação aceita também .json antigos.
const canGzip=()=>typeof CompressionStream!=='undefined'&&typeof DecompressionStream!=='undefined';
const exportPayload=(withPhotos=true)=>{const o={app:'GaragePro',appVer:APP_VER,exportado:new Date().toISOString(),...S};if(!withPhotos)o.vehicles=o.vehicles.map(v=>({...v,foto:''}));return o};
async function gzipBytes(str){const s=new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));return new Uint8Array(await new Response(s).arrayBuffer())}
async function gunzipText(buf){const s=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(s).text()}
function bytesB64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
async function buildBackup(withPhotos=true){
 const json=JSON.stringify(exportPayload(withPhotos));
 if(canGzip()){const b=await gzipBytes(json);return{bytes:b,ext:'garagepro',mime:'application/octet-stream',size:b.length,raw:json.length}}
 const b=new TextEncoder().encode(json);return{bytes:b,ext:'json',mime:'application/json',size:b.length,raw:json.length};
}
const fmtSize=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1).replace('.',',')+' MB';
async function exportData(withPhotos=true){
 let bk;try{bk=await buildBackup(withPhotos)}catch(_){return toast('Não foi possível criar a cópia')}
 const name=`garagepro-${todayISO()}.${bk.ext}`;
 const FS=plug('Filesystem'),SH=plug('Share');
 if(isNative()&&FS&&SH){
  try{const w=await FS.writeFile({path:name,data:bytesB64(bk.bytes),directory:'CACHE'});await SH.share({title:'Cópia GaragePro',text:name,url:w.uri,dialogTitle:'Enviar cópia (Quick Share, WhatsApp, Drive…)'});markExported();toast('Cópia enviada');return}
  catch(e){if(/cancel/i.test(String(e&&e.message||e)))return;toast('Não foi possível partilhar a cópia')}
  return;
 }
 const blob=new Blob([bk.bytes],{type:bk.mime});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);markExported();toast('Cópia guardada nas Transferências');
}
async function importFile(f){
 if(!f)return;
 if(f.size>60*1024*1024)return toast('Ficheiro demasiado grande');
 const bad='Este ficheiro não é uma cópia da GaragePro';
 let txt;
 try{const buf=new Uint8Array(await f.arrayBuffer());txt=buf[0]===0x1f&&buf[1]===0x8b?await gunzipText(buf):new TextDecoder().decode(buf)}catch(_){return toast(bad)}
 let o;try{o=JSON.parse(txt)}catch(_){return toast(bad)}
 if(!o||typeof o!=='object'||!Array.isArray(o.vehicles)||!Array.isArray(o.records))return toast(bad);
 let n;try{n=normalize(JSON.parse(JSON.stringify(o)))}catch(_){return toast('A cópia está danificada')}
 importSheet(n,o,f.name);
}

/* cópia automática diária (só no APK): Documentos/GaragePro, guarda as últimas 7 */
const AUTO_DIR='GaragePro';
async function dailyBackup(force){
 const FS=plug('Filesystem');if(!isNative()||!FS)return{ok:false,why:'web'};
 const p=S.prefs||{};if(p.autoDaily===false&&!force)return{ok:false,why:'off'};
 if(!force&&p.autoDailyLast===todayISO())return{ok:true,skip:true};
 if(!(S.vehicles.length+S.records.length+S.moves.length))return{ok:false,why:'empty'};
 try{
  const bk=await buildBackup(true),name=`garagepro-auto-${todayISO()}.${bk.ext}`;
  await FS.writeFile({path:`${AUTO_DIR}/${name}`,data:bytesB64(bk.bytes),directory:'DOCUMENTS',recursive:true});
  try{const r=await FS.readdir({path:AUTO_DIR,directory:'DOCUMENTS'});const fs=(r.files||[]).map(x=>typeof x==='string'?x:x.name).filter(n=>/^garagepro-auto-\d{4}-\d{2}-\d{2}\./.test(n)).sort();
   for(const old of fs.slice(0,Math.max(0,fs.length-7)))await FS.deleteFile({path:`${AUTO_DIR}/${old}`,directory:'DOCUMENTS'}).catch(()=>{})}catch(_){}
  S.prefs={...S.prefs,autoDailyLast:todayISO(),autoDailyErr:''};save();return{ok:true,size:bk.size};
 }catch(e){S.prefs={...S.prefs,autoDailyErr:String(e&&e.message||e).slice(0,120)};save();return{ok:false,why:'err'}}
}

async function runDaily(){const r=await dailyBackup(true);render();toast(r.ok?'Cópia guardada em Documentos/GaragePro':'Não foi possível guardar a cópia')}

/* ================== VALIDAÇÃO DE DADOS (segurança) ================== */
// Tudo o que entra (importação, cópias automáticas, dados guardados) passa por aqui:
// ids só com letras/números, fotos só como imagem, números como números, textos com tamanho limitado.
const ID_RE=/^[A-Za-z0-9_-]{1,40}$/,DATE_RE=/^\d{4}-\d{2}-\d{2}$/,FOTO_RE=/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/;
const sStr=(x,n=300)=>x==null?'':String(x).slice(0,n);
const sNum=x=>{const n=+x;return isFinite(n)?n:0};
const sDate=(x,def)=>typeof x==='string'&&DATE_RE.test(x)?x:(def===undefined?todayISO():def);
function sanitize(s){
 const vmap=new Map(),cmap=new Map(),seen=new Set();
 const fixId=(id,map)=>{const k=String(id??'');let n=ID_RE.test(k)&&!seen.has(k)?k:uid();seen.add(n);if(map)map.set(k,n);return n};
 const obj=x=>x&&typeof x==='object';
 s.clients=s.clients.filter(obj).map(c=>({id:fixId(c.id,cmap),nome:sStr(c.nome,80).trim()||'Sem nome',tel:sStr(c.tel,30),notas:sStr(c.notas,300)}));
 const mC=id=>id!=null&&cmap.has(String(id))?cmap.get(String(id)):'';
 s.vehicles=s.vehicles.filter(obj).map(v=>({id:fixId(v.id,vmap),owner:mC(v.owner),marca:sStr(v.marca,40),modelo:sStr(v.modelo,60),ano:pInt(v.ano)||'',motor:sStr(v.motor,40),cv:pInt(v.cv)||'',comb:COMB.includes(v.comb)?v.comb:'Diesel',caixa:CAIXA.includes(v.caixa)?v.caixa:'Manual',carro:CARRO.includes(v.carro)?v.carro:'Hatchback',matricula:sStr(v.matricula,12),dataMat:normMat(v.dataMat),km:Math.max(0,Math.round(sNum(v.km))),foto:typeof v.foto==='string'&&FOTO_RE.test(v.foto)?v.foto:''}));
 const mV=id=>id!=null&&vmap.has(String(id))?vmap.get(String(id)):'';
 const ownerOf=vid=>{const v=s.vehicles.find(x=>x.id===vid);return v?v.owner:''};
 s.records=s.records.filter(obj).map(r=>{const vid=mV(r.vid);if(!vid)return null;const tipo=CAT[r.tipo]||r.tipo==='outro'?r.tipo:'outro';
  return{id:fixId(r.id),vid,kind:r.kind==='peca'?'peca':'manutencao',tipo,titulo:sStr(tipo==='outro'?(r.titulo||(CAT[r.tipo]?'':r.tipo)):r.titulo,80),motivo:r.motivo==='avaria'?'avaria':'preventiva',data:sDate(r.data),km:Math.round(sNum(r.km))>0?Math.round(sNum(r.km)):null,
   pecas:arr(r.pecas).filter(obj).slice(0,50).map(p=>({key:CAT[p.key]?p.key:'',nome:sStr(p.nome,80),qtd:sNum(p.qtd)>0?sNum(p.qtd):1,un:UNITS.includes(p.un)?p.un:'un'})),notas:sStr(r.notas,2000)}}).filter(Boolean);
 s.moves=s.moves.filter(obj).map(m=>{const tipo=['recebi','comprei','cobrar'].includes(m.tipo)?m.tipo:null;if(!tipo)return null;const vid=mV(m.vid);let cid=mC(m.cid);if(vid&&!cid)cid=ownerOf(vid);
  const o={id:fixId(m.id),tipo,valor:Math.abs(sNum(m.valor)),data:sDate(m.data),desc:sStr(m.desc,120),vid,cid};if(tipo==='comprei')o.pago=m.pago!==false;return o}).filter(Boolean);
 s.tasks=s.tasks.filter(obj).map(t=>({id:fixId(t.id),titulo:sStr(t.titulo,120).trim()||'Tarefa',vid:mV(t.vid),prio:t.prio==='urgente'?'urgente':'normal',prazo:sDate(t.prazo,''),notas:sStr(t.notas,1000),feito:!!t.feito,criado:sDate(t.criado),feitoEm:t.feito?sDate(t.feitoEm):'',sug:typeof t.sug==='string'&&/^[\w-]{1,40}:[a-z_]{1,30}$/.test(t.sug)?t.sug:''}));
 const iv={};Object.keys(CAT).forEach(k=>{const x=s.intervals&&s.intervals[k];if(obj(x))iv[k]={km:Math.max(0,Math.round(sNum(x.km))),m:Math.max(0,Math.round(sNum(x.m)))}});s.intervals=iv;
 const p=obj(s.prefs)?s.prefs:{};
 const obg={noite:'tema',grafite:'tema',aurora:'tema',estrada:'tema'};
 s.prefs={bg:obg[p.bg]||sStr(p.bg,20)||'tema',bgInt:sStr(p.bgInt,10)||'media',style:sStr(p.style,12)||'sobrio',mode:sStr(p.mode,8)||'escuro',accent:sStr(p.accent,12),layout:sStr(p.layout,8)||'auto',...(typeof p.autoDaily==='boolean'?{autoDaily:p.autoDaily}:{}),autoDailyLast:sDate(p.autoDailyLast,''),autoDailyErr:sStr(p.autoDailyErr,120),zoom:sStr(p.zoom,5)||'1',...(typeof p.updAuto==='boolean'?{updAuto:p.updAuto}:{}),...(typeof p.updLast==='string'?{updLast:sStr(p.updLast,30)}:{}),
  lastExport:sStr(p.lastExport,30),bakSnooze:sDate(p.bakSnooze,''),firstUse:sDate(p.firstUse,todayISO()),pinFails:Math.max(0,Math.round(sNum(p.pinFails))),pinUntil:Math.max(0,sNum(p.pinUntil)),
  ...(obj(p.pin)&&/^[A-Za-z0-9+\/=]{16,64}$/.test(p.pin.salt)&&/^[A-Za-z0-9+\/=]{40,64}$/.test(p.pin.hash)&&[4,5,6].includes(p.pin.len)?{pin:{salt:p.pin.salt,hash:p.pin.hash,len:p.pin.len}}:{})};
 s.ver=3;
 return s;
}
const _lk={};const lock=k=>{const t=Date.now();if(t-(_lk[k]||0)<800)return true;_lk[k]=t;return false};
const safeUpdUrl=u=>typeof u==='string'&&/^https:\/\/github\.com\/[\w.-]+\/[\w.-]+\/releases\/(download|tag)\//.test(u);

/* ================== IMPORTAR (com comparação) ================== */
let IMP=null;
const lastAct=s=>[...s.records.map(r=>r.data),...s.moves.map(m=>m.data),...s.tasks.map(t=>t.feitoEm||t.criado||'')].filter(Boolean).sort().pop()||'';
const cnt=s=>({v:s.vehicles.length,c:s.clients.length,r:s.records.length,m:s.moves.length,t:s.tasks.length});
function importSheet(n,raw,name){
 IMP=n;const a=cnt(S),b=cnt(n),la=lastAct(S),lb=lastAct(n);
 const exp=typeof raw.exportado==='string'&&!isNaN(new Date(raw.exportado))?new Date(raw.exportado):null;
 const hasData=a.v+a.r+a.m+a.t>0,newer=hasData&&la&&(!lb||la>lb),fewer=hasData&&(b.v<a.v||b.r<a.r||b.m<a.m||b.t<a.t),risk=newer||fewer;
 const row=(lab,x,y)=>`<tr><td>${lab}</td><td>${x}</td><td class="${hasData&&y<x?'c-warn':''}">${y}</td></tr>`;
 openSheet(`<h3>Importar cópia</h3><p class="hint">${esc(name)}${exp?' · criada a '+fmtD(iso(exp))+' às '+exp.toTimeString().slice(0,5):''}${raw.appVer?' · app v'+esc(String(raw.appVer).slice(0,8)):''}</p>
  <table class="cmp"><tr><th></th><th>Atuais</th><th>Na cópia</th></tr>${row('Veículos',a.v,b.v)}${row('Clientes',a.c,b.c)}${row('Reparações',a.r,b.r)}${row('Movimentos',a.m,b.m)}${row('Tarefas',a.t,b.t)}<tr><td>Último registo</td><td>${la?fmtD(la):'—'}</td><td class="${newer?'c-warn':''}">${lb?fmtD(lb):'—'}</td></tr></table>
  ${risk?`<div class="note warnn">${I('alert')}<span>${newer?`Os dados atuais têm registos <b>mais recentes</b> (${fmtD(la)}) do que a cópia${lb?' ('+fmtD(lb)+')':''}. `:''}${fewer?'A cópia tem <b>menos</b> registos do que os dados atuais. ':''}Ao importar, perdes o que não estiver na cópia.</span></div>`:''}
  <p class="hint">Antes de substituir, a app guarda uma cópia automática dos dados atuais (Definições → Atualizações → Cópias automáticas).</p>
  <button class="btn${risk?' warnb':''}" onclick="doImport()">${I('upload')} ${risk?'Substituir mesmo assim':'Substituir pelos dados da cópia'}</button>
  <button class="btn ghost" onclick="closeSheet();IMP=null">Cancelar</button>`);
}
async function doImport(){
 if(!IMP||lock('imp'))return;
 await autoBackup('Antes de importar');
 IMP.prefs=S.prefs;S=IMP;IMP=null;UI.cur=myVeh()[0]?.id||S.vehicles[0]?.id||null;UI.tlVeh='all';UI.autobak=undefined;
 save();closeSheet();tab('home');toast('Dados importados');
}

/* ================== ATUALIZAÇÕES (APK via GitHub Releases) ================== */
// APP_BUILD e UPDATE_REPO são preenchidos automaticamente pelo GitHub Actions ao gerar o APK.
const APP_BUILD=0;
const UPDATE_REPO='__REPO__';
const isNative=()=>!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const plug=n=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins[n];
const repoOK=()=>/^[\w.-]+\/[\w.-]+$/.test(UPDATE_REPO);
let UP={st:'idle',rel:null,err:''};
const buildOf=tag=>{const m=String(tag||'').match(/-b(\d+)$/);return m?+m[1]:0};
const verOf=tag=>String(tag||'').replace(/^v/,'').replace(/-b\d+$/,'');
async function checkUpdates(silent){
 if(!repoOK()){UP={st:'error',rel:null,err:'Repositório não configurado (só funciona no APK gerado pelo GitHub).'};if(!silent)render();return}
 UP={...UP,st:'checking',err:''};if(!silent)render();
 try{
  const r=await fetch(`https://api.github.com/repos/${UPDATE_REPO}/releases/latest`,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});
  if(r.status===404)throw new Error('Ainda não há nenhuma versão publicada no GitHub.');
  if(r.status===403)throw new Error('O GitHub limitou os pedidos. Tenta daqui a uns minutos.');
  if(!r.ok)throw new Error('Erro do GitHub ('+r.status+').');
  const j=await r.json();
  const apk=(j.assets||[]).find(a=>/\.apk$/i.test(a.name));
  const rel={tag:j.tag_name,ver:verOf(j.tag_name),build:buildOf(j.tag_name),notes:j.body||'',date:(j.published_at||'').slice(0,10),url:apk?apk.browser_download_url:j.html_url,size:apk?apk.size:0,page:j.html_url};
  const newer=rel.build>APP_BUILD;
  UP={st:newer?'avail':'none',rel,err:''};
  S.prefs={...(S.prefs||{}),updLast:new Date().toISOString()};save();
  if(silent&&newer)toast(`Atualização v${rel.ver} disponível`);
 }catch(e){UP={st:'error',rel:null,err:e.message||'Sem ligação à internet.'}}
 render();
}
async function autoBackup(reason){
 try{
  if(!DBOK)return;
  const list=(await DB.get('autobak'))||[];
  list.unshift({d:new Date().toISOString(),ver:APP_VER,build:APP_BUILD,reason,data:JSON.parse(JSON.stringify(S))});
  await DB.set('autobak',list.slice(0,3));
 }catch(_){}
}
async function installUpdate(){
 if(!UP.rel||UP.dl)return;
 const url=UP.rel.url;
 if(!safeUpdUrl(url))return toast('Endereço de atualização inválido');
 const IN=plug('Instalador');
 if(isNative()&&IN&&IN.descarregarEInstalar){
  try{const p=await IN.podeInstalar();if(!p.ok)return permSheet()}catch(_){}
  await autoBackup('Antes de atualizar para v'+UP.rel.ver);
  UP.dl={pct:0};render();
  let h=null;try{h=await IN.addListener('progresso',d=>{UP.dl={pct:d.pct||0};const b=$('#dlbar');if(b){b.style.width=UP.dl.pct+'%';$('#dlpct').textContent=UP.dl.pct+'%'}})}catch(_){}
  try{await IN.descarregarEInstalar({url});UP.dl=null;render();toast('Toca em Atualizar no ecrã do Android')}
  catch(e){UP.dl=null;render();toast('Falhou a transferência: '+String(e&&e.message||e).slice(0,80))}
  finally{try{h&&h.remove()}catch(_){}}
  return;
 }
 // versão antiga do APK (sem instalador nativo) ou browser: abre no Chrome normal
 await autoBackup('Antes de atualizar para v'+UP.rel.ver);
 window.open(url,'_system');
 toast('A abrir no Chrome… se pedir confirmação, escolhe Transferir mesmo assim');
}
function permSheet(){
 openSheet(`<h3>Falta uma autorização</h3><p class="hint">Para se atualizar sozinha, a GaragePro precisa de autorização do Android para instalar apps. Só é preciso fazer isto uma vez.</p>
  <ol class="steps"><li>Carrega em <b>Abrir definições</b>.</li><li>Ativa <b>Permitir desta origem</b>.</li><li>Volta à app e carrega outra vez em <b>Descarregar e instalar</b>.</li></ol>
  <button class="btn" onclick="closeSheet();plug('Instalador').abrirPermissao()">${I('shield')} Abrir definições</button>`);
}
function mdLite(s){
 return esc(s).split(/\r?\n/).map(l=>{l=l.trim();if(!l)return'';if(/^[-*] /.test(l))return `<li>${l.slice(2)}</li>`;return `<p>${l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}</p>`}).join('').replace(/(<li>.*?<\/li>)+/g,m=>`<ul>${m}</ul>`);
}
async function vUpdatesLoad(){UI.autobak=DBOK?((await DB.get('autobak'))||[]):[];render()}
function vUpdates(){
 if(UI.autobak===undefined){UI.autobak=null;vUpdatesLoad()}
 const nat=isNative(),p=S.prefs||{};
 let h=hdr('Atualizações');
 h+=`<div class="card shero"><img class="lgimg" src="${LOGO}" alt=""><div><b>GaragePro v${APP_VER}</b><small>${APP_BUILD?'Compilação '+APP_BUILD:'Versão de desenvolvimento'} · ${nat?'App instalada (APK)':'A correr no browser'}</small></div></div>`;
 h+='<div class="wrap">';
 if(!nat)h+=`<div class="note">${I('info')}<span>Estás a usar a versão do browser. As atualizações automáticas funcionam no <b>APK</b> instalado no telemóvel.${repoOK()?` Podes descarregar o APK mais recente <a class="c-pri" href="https://github.com/${UPDATE_REPO}/releases/latest" target="_blank">aqui</a>.`:''}</span></div>`;
 const st=UP.st;
 if(st==='checking')h+=`<div class="card upd"><div class="spin"></div><b>A procurar atualizações…</b></div>`;
 else if(st==='none')h+=`<div class="card upd ok"><span class="bub b-ok">${I('check')}</span><div><b>Estás na versão mais recente</b><small>v${esc(UP.rel.ver)} · compilação ${UP.rel.build} · publicada a ${fmtD(UP.rel.date)}</small></div></div>`;
 else if(st==='error')h+=`<div class="card upd bad"><span class="bub b-bad">${I('alert')}</span><div><b>Não foi possível verificar</b><small>${esc(UP.err)}</small></div></div>`;
 else if(st==='avail'){
  const r=UP.rel;
  h+=`<div class="card upd new"><span class="bub b-pri">${I('download')}</span><div><b>Nova versão: v${esc(r.ver)}</b><small>Compilação ${r.build} · ${fmtD(r.date)}${r.size?' · '+(r.size/1048576).toFixed(1).replace('.',',')+' MB':''}</small></div></div>`;
  if(r.notes)h+=`<div class="card cl" style="margin:12px 0 0"><div class="top"><span class="vb">Novidades</span></div><div class="notes">${mdLite(r.notes)}</div></div>`;
  h+=UP.dl?`<div class="card upd"><div class="spin"></div><div style="flex:1"><b>A descarregar… <span id="dlpct">${UP.dl.pct}%</span></b><div class="pbar"><i id="dlbar" style="width:${UP.dl.pct}%;background:var(--pri)"></i></div></div></div>`
   :`<button class="btn" onclick="installUpdate()">${I('download')} Descarregar e instalar</button>`;
  h+=`<p class="hint">Antes de descarregar, a app guarda uma cópia automática dos teus dados. No fim abre o instalador do Android: toca em <b>Atualizar</b>. Os dados mantêm-se.</p>`;
 }
 if(st!=='avail')h+=`<button class="btn" onclick="checkUpdates()" ${st==='checking'?'disabled':''}>${I('history')} Verificar atualizações</button>`;
 h+=`</div><div class="sec"><h2>Opções</h2></div><div class="card grp">
  <div class="opt"><span class="bub b-pri">${I('bell')}</span><div style="flex:1">Verificar ao abrir a app<small style="display:block;color:var(--mut);font-size:12.5px">${p.updLast?'Última verificação: '+fmtD(p.updLast.slice(0,10)):'Ainda não verificado'}</small></div><div class="seg" style="width:120px"><button class="${p.updAuto!==false?'on':''}" onclick="S.prefs={...S.prefs,updAuto:true};save();render()">Sim</button><button class="${p.updAuto===false?'on':''}" onclick="S.prefs={...S.prefs,updAuto:false};save();render()">Não</button></div></div></div>`;
 const ab=UI.autobak;
 h+=`<div class="sec"><h2>Cópias automáticas</h2></div>`;
 if(ab===null)h+=`<div class="empty sm">A carregar…</div>`;
 else if(!ab.length)h+=`<div class="empty sm">Ainda não há cópias automáticas. É feita uma antes de cada atualização.</div>`;
 else h+=`<div class="list">${ab.map((b,i)=>`<div class="row card"><span class="bub b-ok">${I('box')}</span><div class="mid"><b>${fmtD(iso(new Date(b.d)))} às ${new Date(b.d).toTimeString().slice(0,5)}</b><small>${esc(b.reason)} · ${(b.data.vehicles||[]).length} veículo(s), ${(b.data.records||[]).length} reparação(ões)</small></div><button class="btn ghost sm" style="width:auto;margin:0;padding:0 14px" onclick="restoreAuto(${i})">Restaurar</button></div>`).join('')}</div>`;
 h+=`<div class="wrap"><p class="hint" style="margin:12px 2px 6px">As atualizações vêm do GitHub${repoOK()?` (<b>${esc(UPDATE_REPO)}</b>)`:''}. O Android pede sempre confirmação para instalar — é uma regra de segurança do sistema.</p></div>`;
 return h;
}
async function restoreAuto(i){
 const b=(UI.autobak||[])[i];if(!b)return;
 if(!confirm(`Repor os dados de ${fmtD(iso(new Date(b.d)))}? Os dados atuais serão substituídos.`))return;
 S=normalize(b.data);save();applyPrefs();toast('Dados repostos');tab('home');
}
function updBadge(){return UP.st==='avail'}

/* ================== SHEET / TOAST ================== */
function openSheet(html,noAnim){closeSheet();const d=document.createElement('div');d.className='sheet-bg'+(noAnim?' na':'');d.id='sheet';d.innerHTML=`<div class="sheet"><div class="grab"></div>${html}</div>`;d.addEventListener('click',e=>{if(e.target===d)closeSheet()});document.body.appendChild(d);a11y(d)}
function closeSheet(){const s=$('#sheet');s&&s.remove()}
let tT;function toast(t){let e=$('.toast');if(!e){e=document.createElement('div');e.className='toast';document.body.appendChild(e)}e.textContent=t;clearTimeout(tT);tT=setTimeout(()=>e.remove(),2200)}

/* ================== ARRANQUE ================== */
(async function init(){
 try{await DB.open();const s=await DB.get('state');if(s){const was=s.ver||1;S=normalize(s);if(was<3)save()}}
 catch(e){DBOK=false;try{const s=localStorage.getItem('garagepro');if(s)S=normalize(JSON.parse(s))}catch(_){}}
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
 UI.cur=myVeh()[0]?.id||S.vehicles[0]?.id||null;
 if(!(S.prefs||{}).firstUse){S.prefs={...S.prefs,firstUse:todayISO()};save()}
 applyPrefs();
 [['icon',LOGO],['apple-touch-icon',LOGO]].forEach(([r,u])=>{const l=document.createElement('link');l.rel=r;l.href=u;document.head.appendChild(l)});
 history.replaceState({root:1},'');history.pushState({n:1},'');
 render();
 lockNow();
 setTimeout(()=>dailyBackup(),2500);
 if(isNative()&&repoOK()&&(S.prefs||{}).updAuto!==false)setTimeout(()=>checkUpdates(true),1500);
})();

</script>
