  if(!DBOK)return;
  const list=(await DB.get('autobak'))||[];
  list.unshift({d:new Date().toISOString(),ver:APP_VER,build:APP_BUILD,reason,data:JSON.parse(JSON.stringify(S))});
  await DB.set('autobak',list.slice(0,3));
 }catch(_){}
}
async function installUpdate(){
 if(!UP.rel||UP.dl)return;
 const url=UP.rel.url;
 if(!safeUpdUrl(url))return toast('Endereço de atualização inválido');
 const IN=plug('Instalador');
 if(isNative()&&IN&&IN.descarregarEInstalar){
  try{const p=await IN.podeInstalar();if(!p.ok)return permSheet()}catch(_){}
  await autoBackup('Antes de atualizar para v'+UP.rel.ver);
  UP.dl={pct:0};render();
  let h=null;try{h=await IN.addListener('progresso',d=>{UP.dl={pct:d.pct||0};const b=$('#dlbar');if(b){b.style.width=UP.dl.pct+'%';$('#dlpct').textContent=UP.dl.pct+'%'}})}catch(_){}
  try{await IN.descarregarEInstalar({url});UP.dl=null;render();toast('Toca em Atualizar no ecrã do Android')}
  catch(e){UP.dl=null;render();toast('Falhou a transferência: '+String(e&&e.message||e).slice(0,80))}
  finally{try{h&&h.remove()}catch(_){}}
  return;
 }
 // versão antiga do APK (sem instalador nativo) ou browser: abre no Chrome normal
 await autoBackup('Antes de atualizar para v'+UP.rel.ver);
 window.open(url,'_system');
 toast('A abrir no Chrome… se pedir confirmação, escolhe Transferir mesmo assim');
}
function permSheet(){
 openSheet(`<h3>Falta uma autorização</h3><p class="hint">Para se atualizar sozinha, a GaragePro precisa de autorização do Android para instalar apps. Só é preciso fazer isto uma vez.</p>
  <ol class="steps"><li>Carrega em <b>Abrir definições</b>.</li><li>Ativa <b>Permitir desta origem</b>.</li><li>Volta à app e carrega outra vez em <b>Descarregar e instalar</b>.</li></ol>
  <button class="btn" onclick="closeSheet();plug('Instalador').abrirPermissao()">${I('shield')} Abrir definições</button>`);
}
function mdLite(s){
 return esc(s).split(/\r?\n/).map(l=>{l=l.trim();if(!l)return'';if(/^[-*] /.test(l))return `<li>${l.slice(2)}</li>`;return `<p>${l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}</p>`}).join('').replace(/(<li>.*?<\/li>)+/g,m=>`<ul>${m}</ul>`);
}
async function vUpdatesLoad(){UI.autobak=DBOK?((await DB.get('autobak'))||[]):[];render()}
const isPC=()=>!!window.gpDesktop;
function vUpdatesPC(){
 let h=hdr('Atualizações');
 h+=`<div class="card shero"><img class="lgimg" src="${LOGO}" alt=""><div><b>GaragePro v${APP_VER}</b><small>${APP_BUILD?'Compilação '+APP_BUILD+' · ':''}Computador (Windows)</small></div></div>`;
 h+=`<div class="wrap"><div class="note">${I('info')}<span>A versão do computador procura atualizações sozinha ao abrir. Descarrega em segundo plano e pergunta se queres reiniciar; se disseres "Mais tarde", instala quando fechares a app.</span></div>`;
 if(UI.pcUpd)h+=`<div class="card upd"><span class="bub b-pri">${I('download')}</span><div><b>${esc(UI.pcUpd)}</b></div></div>`;
 h+=`<button class="btn" onclick="pcCheck()">${I('history')} Procurar atualizações agora</button></div>`;
 return h;
}
async function pcCheck(){UI.pcUpd='A procurar atualizações…';render();try{UI.pcUpd=await window.gpDesktop.checkUpdates()}catch(_){UI.pcUpd='Não foi possível verificar'}render()}
function vUpdates(){
 if(isPC())return vUpdatesPC();
 if(UI.autobak===undefined){UI.autobak=null;vUpdatesLoad()}
 const nat=isNative(),p=S.prefs||{};
 let h=hdr('Atualizações');
 h+=`<div class="card shero"><img class="lgimg" src="${LOGO}" alt=""><div><b>GaragePro v${APP_VER}</b><small>${APP_BUILD?'Compilação '+APP_BUILD:'Versão de desenvolvimento'} · ${nat?'App instalada (APK)':'A correr no browser'}</small></div></div>`;
 h+='<div class="wrap">';
 if(!nat)h+=`<div class="note">${I('info')}<span>Estás a usar a versão do browser. As atualizações automáticas funcionam no <b>APK</b> instalado no telemóvel.${repoOK()?` Podes descarregar o APK mais recente <a class="c-pri" href="https://github.com/${UPDATE_REPO}/releases/latest" target="_blank">aqui</a>.`:''}</span></div>`;
 const st=UP.st;
 if(st==='checking')h+=`<div class="card upd"><div class="spin"></div><b>A procurar atualizações…</b></div>`;
 else if(st==='none')h+=`<div class="card upd ok"><span class="bub b-ok">${I('check')}</span><div><b>Estás na versão mais recente</b><small>v${esc(UP.rel.ver)} · compilação ${UP.rel.build} · publicada a ${fmtD(UP.rel.date)}</small></div></div>`;
 else if(st==='error')h+=`<div class="card upd bad"><span class="bub b-bad">${I('alert')}</span><div><b>Não foi possível verificar</b><small>${esc(UP.err)}</small></div></div>`;
 else if(st==='avail'){
  const r=UP.rel;
  h+=`<div class="card upd new"><span class="bub b-pri">${I('download')}</span><div><b>Nova versão: v${esc(r.ver)}</b><small>Compilação ${r.build} · ${fmtD(r.date)}${r.size?' · '+(r.size/1048576).toFixed(1).replace('.',',')+' MB':''}</small></div></div>`;
  if(r.notes)h+=`<div class="card cl" style="margin:12px 0 0"><div class="top"><span class="vb">Novidades</span></div><div class="notes">${mdLite(r.notes)}</div></div>`;
  h+=UP.dl?`<div class="card upd"><div class="spin"></div><div style="flex:1"><b>A descarregar… <span id="dlpct">${UP.dl.pct}%</span></b><div class="pbar"><i id="dlbar" style="width:${UP.dl.pct}%;background:var(--pri)"></i></div></div></div>`
   :`<button class="btn" onclick="installUpdate()">${I('download')} Descarregar e instalar</button>`;
  h+=`<p class="hint">Antes de descarregar, a app guarda uma cópia automática dos teus dados. No fim abre o instalador do Android: toca em <b>Atualizar</b>. Os dados mantêm-se.</p>`;
 }
 if(st!=='avail')h+=`<button class="btn" onclick="checkUpdates()" ${st==='checking'?'disabled':''}>${I('history')} Verificar atualizações</button>`;
 h+=`</div><div class="sec"><h2>Opções</h2></div><div class="card grp">
  <div class="opt"><span class="bub b-pri">${I('bell')}</span><div style="flex:1">Verificar ao abrir a app<small style="display:block;color:var(--mut);font-size:12.5px">${p.updLast?'Última verificação: '+fmtD(p.updLast.slice(0,10)):'Ainda não verificado'}</small></div><div class="seg" style="width:120px"><button class="${p.updAuto!==false?'on':''}" onclick="S.prefs={...S.prefs,updAuto:true};save();render()">Sim</button><button class="${p.updAuto===false?'on':''}" onclick="S.prefs={...S.prefs,updAuto:false};save();render()">Não</button></div></div></div>`;
 const ab=UI.autobak;
 h+=`<div class="sec"><h2>Cópias automáticas</h2></div>`;
 if(ab===null)h+=`<div class="empty sm">A carregar…</div>`;
 else if(!ab.length)h+=`<div class="empty sm">Ainda não há cópias automáticas. É feita uma antes de cada atualização.</div>`;
 else h+=`<div class="list">${ab.map((b,i)=>`<div class="row card"><span class="bub b-ok">${I('box')}</span><div class="mid"><b>${fmtD(iso(new Date(b.d)))} às ${new Date(b.d).toTimeString().slice(0,5)}</b><small>${esc(b.reason)} · ${(b.data.vehicles||[]).length} veículo(s), ${(b.data.records||[]).length} reparação(ões)</small></div><button class="btn ghost sm" style="width:auto;margin:0;padding:0 14px" onclick="restoreAuto(${i})">Restaurar</button></div>`).join('')}</div>`;
 h+=`<div class="wrap"><p class="hint" style="margin:12px 2px 6px">As atualizações vêm do GitHub${repoOK()?` (<b>${esc(UPDATE_REPO)}</b>)`:''}. O Android pede sempre confirmação para instalar — é uma regra de segurança do sistema.</p></div>`;
 return h;
}
async function restoreAuto(i){
 const b=(UI.autobak||[])[i];if(!b)return;
 if(!confirm(`Repor os dados de ${fmtD(iso(new Date(b.d)))}? Os dados atuais serão substituídos.`))return;
 S=normalize(b.data);save();applyPrefs();toast('Dados repostos');tab('home');
}
function updBadge(){return UP.st==='avail'}

/* ================== SHEET / TOAST ================== */
function openSheet(html,noAnim){closeSheet();const d=document.createElement('div');d.className='sheet-bg'+(noAnim?' na':'');d.id='sheet';d.innerHTML=`<div class="sheet"><div class="grab"></div>${html}</div>`;d.addEventListener('click',e=>{if(e.target===d)closeSheet()});document.body.appendChild(d);a11y(d)}
function closeSheet(){const s=$('#sheet');s&&s.remove()}
let tT;function toast(t){let e=$('.toast');if(!e){e=document.createElement('div');e.className='toast';document.body.appendChild(e)}e.textContent=t;clearTimeout(tT);tT=setTimeout(()=>e.remove(),2200)}

/* ================== ARRANQUE ================== */
(async function init(){
 try{await DB.open();const s=await DB.get('state');if(s){const was=s.ver||1;S=normalize(s);if(was<3)save()}}
 catch(e){DBOK=false;try{const s=localStorage.getItem('garagepro');if(s)S=normalize(JSON.parse(s))}catch(_){}}
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
 await syLoadLocal();
 UI.cur=myVeh()[0]?.id||S.vehicles[0]?.id||null;
 if(!(S.prefs||{}).firstUse){S.prefs={...S.prefs,firstUse:todayISO()};save()}
 applyPrefs();
 pcShell();setInterval(()=>{try{pcStatus()}catch(_){}},15000);
 [['icon',LOGO],['apple-touch-icon',LOGO]].forEach(([r,u])=>{const l=document.createElement('link');l.rel=r;l.href=u;document.head.appendChild(l)});
 history.replaceState({root:1},'');history.pushState({n:1},'');
 render();
 lockNow();
 setTimeout(()=>dailyBackup(),2500);
 if(syOn()){syStart();setTimeout(()=>syncNow(),800)}
 if(isNative()&&repoOK()&&(S.prefs||{}).updAuto!==false)setTimeout(()=>checkUpdates(true),1500);
})();

</script>
</body>
</html>
